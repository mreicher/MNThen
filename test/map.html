function clearStationaryState() {
    // Clear stationary detection
    window.isStationary = false;
    window.stationaryLockPosition = null;
    window.stationaryStartTime = null;
    if (window.stationaryCheckTimeout) {
        clearTimeout(window.stationaryCheckTimeout);
        window.stationaryCheckTimeout = null;
    }

    // window.isStationary is only the fallback — when window.sensorFusion
    // exists, DR and smoothPosition() key off sensorFusion's own
    // _lastStationaryState/_stationaryPosition instead. Without this,
    // the Kalman filter could still be frozen here, and smoothPosition()
    // would keep returning the old frozen position until the normal
    // 2-consecutive-fix hysteresis caught up on its own — a stuck-then-jump
    // right after whatever called this (e.g. handleContinueClick's recenter).
    if (window.sensorFusion) {
        const kf = window.sensorFusion._kalmanFilter;
        if (kf && typeof kf.isFrozen === 'function' && kf.isFrozen()) {
            kf.unfreeze();
        }
        window.sensorFusion._lastStationaryState = false;
        window.sensorFusion._stationaryPosition = null;
        window.sensorFusion._stationarySamples = [];
    }

    if (window.positionBuffer?.length > 0) {
        const lastPos = window.positionBuffer[window.positionBuffer.length - 1];
        if (Date.now() - lastPos.timestamp > 10000) {
            console.debug("clearStationaryState: Clearing buffer due to stale last position (>10s old)");
            window.positionBuffer = [];
        }
    } else if (!window.positionBuffer) {
        window.positionBuffer = [];
    }
    window.lastUpdateTime = null;
}
        
function ensureGPSActive() {
    const GPS_HEARTBEAT_MS = 15000; // 15 seconds without a fix = dead

    if (window.positionWatchId == null) {
        console.log("GPS watch inactive - restarting");
        startPositionUpdates();
        return;
    }

    const lastFixAge = window.lastUpdateTimestamp
        ? (Date.now() - window.lastUpdateTimestamp)
        : Infinity;

    if (lastFixAge > GPS_HEARTBEAT_MS) {
        console.log(`GPS watch stale (${Math.round(lastFixAge / 1000)}s) - restarting`);
        if (window.positionWatchId != null) {
            navigator.geolocation.clearWatch(window.positionWatchId);
            window.positionWatchId = null;
        }
        startPositionUpdates();
    } else {
        console.log("GPS watch active - awaiting fresh updates");
    }
}
        
function _restoreFullTracking() {
    window.followUser = true;
    window.isMapInteracting = false;
    window.isLocationHuntVisible = false;
    if (window.lastPosition?.lat !== undefined && window.lastPosition?.lng !== undefined) {
        if (!window.lastUpdateTime) {
            window.lastUpdateTime = window.lastPosition.timestamp || Date.now();
        }

        const seedPosition = {
            lat: window.lastPosition.lat,
            lng: window.lastPosition.lng,
            accuracy: window.lastPosition.accuracy || 20,
            heading: window.lastPosition.heading ?? null,
            timestamp: Date.now(),
            speedMPS: window.lastPosition.speedMPS || 0
        };
        // Fallback if seedPositionBuffer is unavailable
        if (typeof seedPositionBuffer === 'function') {
            seedPositionBuffer(seedPosition, 5);
        } else {
            window.positionBuffer = [seedPosition];
        }
        const restorationPosition = {
            coords: {
                latitude: seedPosition.lat,
                longitude: seedPosition.lng,
                accuracy: seedPosition.accuracy,
                heading: seedPosition.heading,
                speed: seedPosition.speedMPS
            },
            timestamp: seedPosition.timestamp
        };
        // forceUpdate=false prevents map jumps
        updateUserLocation(restorationPosition, false);
    }
}

            <div class="nt-scrollwrap">
                <div class="nt-body">
                    <p class="nt-lead nt-reveal" style="--d:.2s">Six things worth knowing before you head out.</p>
                    <ul class="nt-tips">${tipsHtml}</ul>
                </div>
                <div class="nt-fade" aria-hidden="true">${ICONS.more}</div>
            </div>
        </div>
    `;

    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';

    const closeBtn    = overlay.querySelector('.nt-close');
    const bodyEl      = overlay.querySelector('.nt-body');
    const fade        = overlay.querySelector('.nt-fade');
    const lastFocused = document.activeElement;
    let closed = false;

    function updateFade() {
        const scrollable = bodyEl.scrollHeight > bodyEl.clientHeight + 4;
        const atBottom   = bodyEl.scrollTop + bodyEl.clientHeight >= bodyEl.scrollHeight - 8;
        fade.classList.toggle('is-visible', scrollable && !atBottom);
    }

    function closeModal() {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onKeydown);
        window.removeEventListener('resize', updateFade);
        overlay.classList.remove('is-open');
        document.body.style.overflow = '';
        setTimeout(() => {
            overlay.remove();
            if (distanceBox) distanceBox.style.removeProperty('display');
            if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
            setTimeout(() => { navigationTipsOpen = false; }, 600);
        }, 300);
    }

    function onKeydown(e) {
        if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
        if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }
    }
    overlay._onKey = onKeydown;
    overlay._onResize = updateFade;

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', onKeydown);
    bodyEl.addEventListener('scroll', updateFade, { passive: true });
    window.addEventListener('resize', updateFade);
    updateFade();

    void overlay.offsetWidth; // force reflow so the entrance transition plays
    overlay.classList.add('is-open');
    setTimeout(() => closeBtn.focus({ preventScroll: true }), 400);
}
        
function startHunt() {
    gameLocations = [...locations].sort((a, b) => a.id - b.id);
    window.gameLocations = gameLocations;
    lastVisitedLocationId = null;
    loadAllLocations();

    // iOS PWA Recovery — do this before starting proximity checks
    var recovered = false;
    try {
        const activeLocationId = localStorage.getItem('activeLocationId');
        if (activeLocationId) {
            const location = gameLocations.find(loc => String(loc.id) === String(activeLocationId));
            if (location) {
                recovered = true;
                requestAnimationFrame(() => {
                    if (typeof showLocationHunt === 'function') {
                        showLocationHunt(location);
                    }
                });
            } else {
                localStorage.removeItem('activeLocationId');
                localStorage.removeItem('audioPosition');
            }
        }
    } catch (e) {
        console.warn('[Recovery] Failed to restore session:', e);
    }

    // Only start proximity checks if not recovering into a location
    if (!recovered) {
        startIdleProximityCheck();
    }
}
        
function getMarkerColor(tours) {
    if (typeof tours !== 'string') return '#0f2bab';
    
    switch (tours.toLowerCase()) {
        case 'person':
            return '#FFA500';
        case 'gangster':
            return '#3f9b0b';
        case 'event':
            return '#8B0000';
        case 'place':
            return '#800080';
        default:
            return '#0f2bab';
    }
}

let activePopups = new Set();
        
function createMarkersOnly() {
    if (!gameLocations || !Array.isArray(gameLocations) || gameLocations.length === 0) {
        console.warn("No game locations available");
        return;
    }
    
    if (markerClusterGroup) {
        markerClusterGroup.clearLayers();
    }
    
    activePopups.clear();
    
    const esc = (str) => typeof str === 'string' 
        ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) 
        : '';
        
    gameLocations.forEach((location) => {
        if (!location || typeof location.lat !== 'number' || typeof location.lng !== 'number') {
            console.warn("Invalid location data:", location);
            return;
        }
        
        const markerColor = getMarkerColor(location.tours);
        location.markerColor = markerColor;
        
        const safeName = esc(String(location.name));
        const safeId = esc(String(location.id));
        const safeImage = esc(String(location.sumimage || location.image || ''));
        
        let safeLink = '';
        if (location.link) {
            try {
                const url = new URL(location.link, window.location.href);
                if (url.protocol === 'http:' || url.protocol === 'https:') safeLink = url.href;
            } catch (e) {}
        }
        
        const locationMarker = L.marker([location.lat, location.lng], {
            icon: L.divIcon({
                className: 'custom-pin-icon',
                html: `<div class="pin-head" style="background-color: ${markerColor};"></div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 30],
            }),
            riseOnHover: false,
            bubblingMouseEvents: false
        });
        
        // Image dimensions are explicitly set to prevent layout reflow jitter
        const popupContent = `
            <div class="popup-content">
                <img loading="eager" 
                     src="${safeImage}" 
                     alt="${safeName}" 
                     class="location-image"
                     width="280" 
                     height="160"
                     style="width: 100%; height: 160px; object-fit: cover; display: block; background: #e2e8f0;"
                     onerror="this.src='${esc(String(location.image || ''))}'">
                     
                <h4 class="location-name">
                    ${safeLink ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">${safeName}</a>` : safeName}
                </h4>
                <div class="popup-buttons">
                    <button class="button route-button" data-lat="${location.lat}" data-lng="${location.lng}" data-location-id="${safeId}" style="touch-action: manipulation; user-select: none;">Directions</button>
                    <button class="button summary-button" data-location-id="${safeId}" style="touch-action: manipulation; user-select: none;">Summary</button>
                </div>
            </div>
        `;
        
        // Explicitly enable autoPan and give it breathing room from the viewport edge
        locationMarker.bindPopup(popupContent, {
            offset: L.point(0, -25),
            className: 'custom-popup',
            maxWidth: 300,
            closeButton: true,
            autoClose: true,
            closeOnClick: true,
            autoPan: true,
            autoPanPadding: L.point(20, 20) 
        });
        
        // Suspend Dead Reckoning when the popup opens to prevent viewport tug-of-war
        locationMarker.on('popupopen', function(e) {
            activePopups.add(locationMarker);
            attachPopupEventListeners(e.popup._contentNode, location);
            
            // Suspend dead reckoning viewport locking temporarily.
            // This prevents the DR loop's _snapViewport from instantly fighting 
            // Leaflet's autoPan, which causes the edge-of-screen jitter.
            window.followUser = false;
            window.isMapInteracting = true;
            
            // Clear the inactivity timer so the map doesn't try to recenter 
            // while the user is actively reading the popup.
            if (typeof _clearInactivityTimer === 'function') {
                _clearInactivityTimer();
            }
        });
        
        locationMarker.on('popupclose', function(e) {
            activePopups.delete(locationMarker);
        });
        
        markerClusterGroup.addLayer(locationMarker);
    });
    
    if (!map.hasLayer(markerClusterGroup)) {
        map.addLayer(markerClusterGroup);
    }
}
        
function attachPopupEventListeners(popupElement, location) {
    const routeButton = popupElement.querySelector('.route-button');
    const summaryButton = popupElement.querySelector('.summary-button');
    if (routeButton && !routeButton.hasAttribute('data-listener-attached')) {
        routeButton.setAttribute('data-listener-attached', 'true');
        routeButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            showNavigationModal(location.lat, location.lng);
        });
    }
    if (summaryButton && !summaryButton.hasAttribute('data-listener-attached')) {
        summaryButton.setAttribute('data-listener-attached', 'true');
        summaryButton.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            showLocationSummary(location.id);
        });
    }
}

function closeAllPopups() {
    activePopups.forEach(marker => {
        if (marker.isPopupOpen()) {
            marker.closePopup();
        }
    });
    activePopups.clear();
}

function returnToIndex() {
    const distanceBox = document.querySelector('#distanceBox');
    if (distanceBox) distanceBox.style.display = 'none';

    // Clean up anything already open
    ['creditsModal', 'exitModal'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            if (el._onKey) document.removeEventListener('keydown', el._onKey);
            if (el._onResize) window.removeEventListener('resize', el._onResize);
            el.remove();
        }
    });

    const BRAND = window.BRAND || {};

    function isPWA() {
        if (window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.navigator.standalone === true) return true;
        if (document.referrer.includes('android-app://')) return true;
        return false;
    }
    function closePWAApp() {
        window.location.href = BRAND.siteUrl || 'https://www.mnthen.com';
    }

    const isRunningAsPWA = isPWA();
    const modalTitle   = isRunningAsPWA ? "Close the app?"  : "Ready to leave?";
    const modalMessage = isRunningAsPWA ? "Are you sure you want to close the app?"
                                        : "Are you sure you want to return to the main page?";

    const ICONS = {
        close: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

    };

    const CREDITS = Array.isArray(BRAND.credits) ? BRAND.credits : [];

            </div>
        </div>

    document.body.appendChild(popupDiv);
    document.body.style.overflow = 'hidden';

    const confirmBtn  = popupDiv.querySelector('.ex-primary');
    const cancelBtn   = popupDiv.querySelector('.ex-secondary');
    const creditsLink = popupDiv.querySelector('.ex-credits');
    const lastFocused = document.activeElement;
    let closed = false, confirming = false;

    function closeExit() {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onKey);
        popupDiv.classList.remove('is-open');
        document.body.style.overflow = '';
        setTimeout(() => {
            popupDiv.remove();
            if (distanceBox) distanceBox.style.removeProperty('display');
            if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
        }, 300);
    }

    function onKey(e) {
        if (e.key === 'Escape') {
            if (document.getElementById('creditsModal')) return; // let the top panel handle it
            e.preventDefault();
            closeExit();
            return;
        }
        if (e.key !== 'Tab') return;
        const f = [cancelBtn, confirmBtn, creditsLink];
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    popupDiv._onKey = onKey;

    cancelBtn.addEventListener('click', closeExit);
    popupDiv.addEventListener('click', e => { if (e.target === popupDiv) closeExit(); });

    confirmBtn.addEventListener('click', () => {
        if (confirming) return;
        confirming = true;
        document.removeEventListener('keydown', onKey);
        popupDiv.classList.remove('is-open');

            popupDiv.remove();

            if (isRunningAsPWA) closePWAApp();
            else window.location.href = '/index.html';
        }, 300);
    });

    creditsLink.addEventListener('click', openCredits);
    document.addEventListener('keydown', onKey);

    popupDiv.classList.add('is-open');
    setTimeout(() => cancelBtn.focus({ preventScroll: true }), 400); // safe default

    // ================= ACKNOWLEDGEMENTS =================
    function openCredits() {
        if (document.getElementById('creditsModal')) return;

        const creditsPopup = document.createElement('div');
        creditsPopup.id = 'creditsModal';
        creditsPopup.setAttribute('role', 'dialog');
        creditsPopup.setAttribute('aria-modal', 'true');
        creditsPopup.setAttribute('aria-labelledby', 'crTitle');

        creditsPopup.innerHTML = `
            <div class="cr-card">
                <div class="cr-header">
                    <div class="cr-topo" aria-hidden="true"></div>
                    <button class="cr-close" type="button" aria-label="Close acknowledgements">${ICONS.close}</button>
                    <svg class="cr-medal" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M9.3 14.3L7.5 21l4.5-2.6L16.5 21l-1.8-6.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="cr-eyebrow cr-reveal" style="--d:.05s">With gratitude</div>
                    <h3 class="cr-title cr-reveal" id="crTitle" style="--d:.12s">Acknowledgements</h3>
                </div>
                <div class="cr-scrollwrap">
                    <div class="cr-body">
                        <ul class="cr-list">${creditsHtml}</ul>
                    </div>
                    <div class="cr-fade" aria-hidden="true">${ICONS.more}</div>
                </div>
            </div>
        `;

        document.body.appendChild(creditsPopup);

        const crClose = creditsPopup.querySelector('.cr-close');
        const crBody  = creditsPopup.querySelector('.cr-body');
        const crFade  = creditsPopup.querySelector('.cr-fade');
        let crClosed = false;

        function updateFade() {
            const scrollable = crBody.scrollHeight > crBody.clientHeight + 4;
            const atBottom   = crBody.scrollTop + crBody.clientHeight >= crBody.scrollHeight - 8;
            crFade.classList.toggle('is-visible', scrollable && !atBottom);
        }

        function closeCredits() {
            if (crClosed) return;
            crClosed = true;
            document.removeEventListener('keydown', onCrKey);
            window.removeEventListener('resize', updateFade);
            creditsPopup.classList.remove('is-open');
            setTimeout(() => {
                creditsPopup.remove();
                creditsLink.focus({ preventScroll: true }); // return focus to the trigger
            }, 300);
        }

        function onCrKey(e) {
            if (e.key === 'Escape') { e.preventDefault(); closeCredits(); return; }
            if (e.key !== 'Tab') return;
            const f = [...creditsPopup.querySelectorAll('button, a[href]')].filter(el => el.offsetParent !== null);
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
        creditsPopup._onKey = onCrKey;
        creditsPopup._onResize = updateFade;

        crClose.addEventListener('click', closeCredits);
        creditsPopup.addEventListener('click', e => { if (e.target === creditsPopup) closeCredits(); });
        document.addEventListener('keydown', onCrKey);
        crBody.addEventListener('scroll', updateFade, { passive: true });
        window.addEventListener('resize', updateFade);
        updateFade();

        void creditsPopup.offsetWidth;
        creditsPopup.classList.add('is-open');
        setTimeout(() => crClose.focus({ preventScroll: true }), 400);
    }
}
    
function isSignificantMovement(newPosition) {
    const now = Date.now();

    // Attach tracker to the function to avoid a top-level variable.
    const track = isSignificantMovement._track || (isSignificantMovement._track = {});

    if (!lastPositionForJitter) {
        lastPositionForJitter = newPosition;
        lastSignificantMovement = now;
        track.pos = newPosition;
        track.time = now;
        return true;
    }

    const distance = calculateDistance(lastPositionForJitter, newPosition);

    if (!isFinite(distance)) {
        return false;
    }

    // Optional spike guard: reject fixes that imply physically impossible speed.
    const maxSpeed = CONFIG.MAX_PLAUSIBLE_SPEED;
    if (track.pos && maxSpeed != null) {
        const fixDelta = Math.max(now - track.time, 1) / 1000;
        const step = calculateDistance(track.pos, newPosition);
        const impliedSpeed = step / fixDelta;
        if (isFinite(impliedSpeed) && impliedSpeed > maxSpeed) {
            return false;
        }
    }
    track.pos = newPosition;
    track.time = now;

    const timeSince = now - lastSignificantMovement;
    const spikeThreshold = CONFIG.SPIKE_THRESHOLD ?? (CONFIG.JITTER_THRESHOLD * 5);

    if (
        (distance >= CONFIG.JITTER_THRESHOLD && timeSince >= CONFIG.SIGNIFICANT_MOVEMENT_COOLDOWN) ||
        distance >= spikeThreshold
    ) {
        lastPositionForJitter = newPosition;
        lastSignificantMovement = now;
        return true;
    }
    return false;
}

function resetInactivityTimer(isExplicitInteraction = true) {
    // Stored on window so disposeMapLoop() can clear it by name.
    if (window.inactivityTimer) {
        clearTrackedTimeout(window.inactivityTimer);
        window.inactivityTimer = null;
    }
    window.inactivityTimer = createTrackedTimeout(() => {
        if (!map || !userMarker) return;
        // Never yank the view while the user is actively reading something.
        if (window.isMapInteracting || window.isLocationHuntVisible ||
            (typeof activePopups !== 'undefined' && activePopups.size > 0)) return;
        map.closePopup();
        window.followUser = true;
        window.isMapInteracting = false;
        const userPos = userMarker.getLatLng();
        // Guard against exact 0 lat/lng.
        if (userPos && isFinite(userPos.lat) && isFinite(userPos.lng)) {
            // Snap, don't animate — an animated pan gets cancelled frame-by-frame
            // by DR's _snapViewport and reads as a stutter.
            window._programmaticFlyInProgress = true;
            map.panTo(userPos, { animate: false, noMoveStart: true });
            window._programmaticFlyInProgress = false;
            if (window.deadReckoning?.forceUpdate) window.deadReckoning.forceUpdate();
        }
    }, CONFIG?.INACTIVITY_TIMEOUT ?? 300_000); // 5 min fallback
    if (isExplicitInteraction) {
        window.isMapInteracting = false;
    }
}

function optimizeImages(root = document) {
  if (!root || !root.querySelectorAll) {
    console.warn('optimizeImages: Invalid root element provided');
    return;
  }

  // Unified broken-image handler. Distinct data-optimized values are
  // preserved for downstream consumers.
  const markImageBroken = (img, state) => {
    img.setAttribute('data-optimized', state);
    img.setAttribute('width', '1');
    img.setAttribute('height', '1');
    img.style.visibility = 'hidden';
  };

  try {
    const images = root.querySelectorAll('img:not([data-optimized])');
    
    images.forEach(img => {
      try {
        // querySelectorAll already filtered these out; no need to re-check.
        if (img.closest('template') || 
            img.getRootNode() instanceof ShadowRoot) {
          return;
        }

        const src = img.currentSrc || img.src;
        
        if (!src || src.startsWith('data:') || src === 'about:blank') {
          img.setAttribute('data-optimized', 'no-valid-src');
          return;
        }

        const hasExplicitDimensions = img.hasAttribute('width') || img.hasAttribute('height');
        const hasNaturalDimensions = img.naturalWidth > 0 && img.naturalHeight > 0;
        
        if (hasExplicitDimensions || hasNaturalDimensions) {
          img.setAttribute('data-optimized', 'dimensions-exist');
          if (!img.hasAttribute('loading')) img.loading = 'lazy';
          return;
        }

        const isSVG = src.includes('.svg') || img.src.includes('.svg') || img.type === 'image/svg+xml';
        const isCritical = img.hasAttribute('data-critical') || 
                          img.closest('[data-critical]') ||
                          img.classList.contains('critical-image');
        
        if (isSVG) {
          img.setAttribute('data-optimized', 'svg');
          if (!isCritical && !img.hasAttribute('loading')) img.loading = 'lazy';
          return;
        }

        img.setAttribute('data-optimized', 'processing');

        if (!isCritical && !img.hasAttribute('loading')) {
          img.loading = 'lazy';
        }

        const setDimensions = () => {
          try {
            if (img.naturalWidth > 0 && img.naturalHeight > 0) {
              if (!img.hasAttribute('width') && !img.style.width) {
                img.setAttribute('width', img.naturalWidth);
              }
              if (!img.hasAttribute('height') && !img.style.height) {
                img.setAttribute('height', img.naturalHeight);
              }
              img.setAttribute('data-optimized', 'dimensions-set');
              
              if (!img.style.aspectRatio) {
                img.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
              }
            } else {
              img.setAttribute('data-optimized', 'no-dimensions');
            }
          } catch (error) {
            img.setAttribute('data-optimized', 'dimension-error');
            console.warn('Error setting image dimensions:', error, img.src);
          }
        };

        if (img.complete) {
          if (img.naturalWidth > 0) {
            setDimensions();
          } else {
            markImageBroken(img, 'error-broken');
          }
          return;
        }

        const onLoad = () => {
          if (img.decode) {
            img.decode()
              .then(setDimensions)
              .catch(() => setDimensions());
          } else {
            setTimeout(setDimensions, 0);
          }
        };

        const onError = () => {
          markImageBroken(img, 'error-load');
        };

        // Auto-cleanup listeners after first fire.
        img.addEventListener('load', onLoad, { once: true });
        img.addEventListener('error', onError, { once: true });

      } catch (imgError) {
        console.warn('Error optimizing image:', imgError, img?.src || 'unknown image');
        img?.setAttribute('data-optimized', 'processing-error');
      }
    });
    
  } catch (error) {
    console.error('Error in optimizeImages:', error);
  }
}
        
function setupImageOptimizationObserver() {
      if (typeof MutationObserver === 'undefined') return;
    
      const pendingRoots = new Set();
      let rafId = null;
    
      const processPending = () => {
        rafId = null;
        pendingRoots.forEach(root => {
          // Defense-in-depth: skip if the root itself is a Leaflet container
          // (shouldn't happen given the callback guards, but cheap insurance).
          if (root.closest && root.closest('.leaflet-container')) return;
          optimizeImages(root);
        });
        pendingRoots.clear();
      };
    
      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          if (mutation.type !== 'childList' || mutation.addedNodes.length === 0) continue;
    
          for (const node of mutation.addedNodes) {
            if (node.nodeType !== Node.ELEMENT_NODE) continue;
    
            // ── SKIP LEAFLET INTERNALS ──────────────────────────────────
            // Leaflet creates/destroys hundreds of <img> tiles during
            // pan/zoom. Processing them causes:
            //   1. CPU waste: querySelectorAll on the tile pane every frame
            //   2. Layout breakage: optimizeImages sets width/height/
            //      aspectRatio/loading="lazy" on tiles, conflicting with
            //      Leaflet's own positioning (transform-based, not
            //      attribute-based).
            // Leaflet tiles carry the class "leaflet-tile"; all map
            // internals live under ".leaflet-pane" or ".leaflet-container".
            if (node.classList && node.classList.contains('leaflet-tile')) continue;
            if (node.closest && node.closest('.leaflet-pane')) continue;
    
            if (node.tagName === 'IMG') {
              pendingRoots.add(node.parentElement || document.body);
            } else if (node.querySelector && node.querySelector('img')) {
              pendingRoots.add(node);
            }
          }
        }
    
        // Batch all mutations into a single DOM scan per frame
        if (pendingRoots.size > 0 && rafId === null) {
          rafId = requestAnimationFrame(processPending);
        }
      });
    
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    
      return {
        observer,
        destroy: () => {
          if (rafId) cancelAnimationFrame(rafId);
          pendingRoots.clear();
          observer.disconnect();
        }
      };
    }
    
    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        optimizeImages();
        window.imageOptimizerHandle = setupImageOptimizationObserver();
      });
    } else {
      optimizeImages();
      window.imageOptimizerHandle = setupImageOptimizationObserver();
    }

function setupEventListeners() {
    const setupButtonEvents = () => {
        const buttonConfigs = [
            { id: 'recenterButton', handler: fullResetMap, required: true },
            { id: 'returnButton', handler: returnToIndex, required: true },
            { id: 'tipsButton', handler: showNavigationTips, required: false }
        ];
        buttonConfigs.forEach(config => {
            try {
                const element = document.getElementById(config.id);
                if (element) {
                    element.addEventListener('click', config.handler);
                } else if (config.required) {
                    console.error(`Required button element not found: ${config.id}`);
                }
            } catch (error) {
                console.error(`Error setting up ${config.id} event:`, error);
            }
        });
    };
       const setupAccessibilityEvents = () => {};
    const setupSystemEvents = () => {
        try {
            document.addEventListener('visibilitychange', () => {
                try {
                    if (typeof handleVisibilityChange === 'function') handleVisibilityChange();
                } catch (error) {
                    console.error('Visibility change handler error:', error);
                }
            });
            let resizeTimeoutId = null;
            window.addEventListener('resize', () => {
                if (resizeTimeoutId != null) clearTrackedTimeout(resizeTimeoutId);
                resizeTimeoutId = createTrackedTimeout(() => {
                    resizeTimeoutId = null;
                    if (map) map.invalidateSize();
                    if (typeof updateDistanceBox === 'function') updateDistanceBox();
                }, 250);
            });
        } catch (error) {
            console.error('Error setting up system events:', error);
        }
    };
    try {
        setupButtonEvents();
        setupAccessibilityEvents();
        setupSystemEvents();
    } catch (error) {
        console.error('Critical error in setupEventListeners:', error);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const initSteps = [
        { name: 'Cache Elements', fn: cacheElements },
        { name: 'Initialize Map', fn: initMap },
        { name: 'Setup Event Listeners', fn: setupEventListeners },
        { name: 'Optimize Images', fn: optimizeImages },
        { name: 'Initialize UI', fn: initializeUI }
    ];
    let successCount = 0;
    
    initSteps.forEach(step => {
        try {
            if (typeof step.fn === 'function') {
                step.fn();
                successCount++;
            } else {
                console.warn(`${step.name} function not available`);
            }
        } catch (error) {
            console.error(`${step.name} failed:`, error);
        }
    });
    console.log(`Application initialization: ${successCount}/${initSteps.length} steps completed`);
});

/* ─── iOS Ghost Click Shield ─── */
(function() {
    'use strict';

    const SHIELD_DURATION_MS = 500;
    const MAP_BUTTON_SELECTOR = '.map-button, #recenterButton, #returnButton, #tipsButton';
    const OVERLAY_SELECTOR = '.modal, .popup-overlay, .navigation-tips-overlay, .source-info-content, #cd-centered-popup, #cd-corner-badge, #summaryModal, #sourceInfoPopup, .reminder-modal';

    let shieldActive = false;
    let shieldTimer = null;
    let lastTouchTime = 0;
    let lastTouchTarget = null;
    let openingOverlay = false;

    function isOverlayElement(el) {
        return !!(el && el.closest && el.closest(OVERLAY_SELECTOR));
    }

    function isMapButton(el) {
        return !!(el && el.closest && el.closest(MAP_BUTTON_SELECTOR));
    }

    function activateShield() {
        shieldActive = true;
        lastTouchTime = Date.now();
        if (shieldTimer) clearTimeout(shieldTimer);
        shieldTimer = setTimeout(() => {
            shieldActive = false;
            shieldTimer = null;
        }, SHIELD_DURATION_MS);
    }

    document.addEventListener('touchstart', function(e) {
        openingOverlay = isMapButton(e.target);
    }, true);

    document.addEventListener('touchend', function(e) {
        lastTouchTarget = e.target;
        if (isOverlayElement(e.target)) {
            activateShield();
        }
        openingOverlay = false;
    }, true);

    document.addEventListener('click', function(e) {
        if (!isMapButton(e.target)) return;

        const timeSinceTouch = Date.now() - lastTouchTime;
        if (!shieldActive || timeSinceTouch >= SHIELD_DURATION_MS) return;

        if (lastTouchTarget) {
            const clickBtn = e.target.closest(MAP_BUTTON_SELECTOR);
            const touchBtn = lastTouchTarget.closest ? lastTouchTarget.closest(MAP_BUTTON_SELECTOR) : null;
            if (clickBtn && clickBtn === touchBtn) return;
        }

        e.stopImmediatePropagation();
        e.preventDefault();
    }, true);

    if (typeof MutationObserver !== 'undefined') {
        const observer = new MutationObserver(function(mutations) {
            if (openingOverlay) return;

            for (const mutation of mutations) {
                if (mutation.type !== 'childList') continue;
                for (const node of mutation.removedNodes) {
                    if (node.nodeType !== Node.ELEMENT_NODE) continue;
                    if (
                        (node.matches && node.matches(OVERLAY_SELECTOR)) ||
                        (node.querySelector && node.querySelector(OVERLAY_SELECTOR))
                    ) {
                        activateShield();
                        return;
                    }
                }
            }
        });

        const startObserving = () => {
            // Observe ONLY direct children of body. Overlays are appended
            // to body, so this catches them. Without subtree:true, this
            // ignores Leaflet tile/marker mutations, saving massive CPU.
            observer.observe(document.body, { childList: true });
        };

        if (document.body) {
            startObserving();
        } else {
            document.addEventListener('DOMContentLoaded', startObserving, { once: true });
        }
    }
})();
