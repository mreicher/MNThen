    ];
}

function showLoadingMessage() {
    if (document.getElementById('loadingMessage')) return;

    _loadingHideRequested = false;

    const BRAND = window.BRAND || {};
    const MNTHEN_ANIMATIONS = getLoadingAnimations();

    // Minimum 5s display so the branding is readable before auto-dismiss.
    loadingMessageMinDisplayTime = Date.now() + 5000;

    // Signal to assistive tech that the page is busy.
    document.documentElement.setAttribute('aria-busy', 'true');

    const loadingMessage = document.createElement('div');
    loadingMessage.id = 'loadingMessage';

    const card = document.createElement('div');
    card.className = 'loading-card';

    const logo = document.createElement('img');
    logo.className = 'loading-logo';
    const siteUrl = (BRAND.siteUrl || '').replace(/\/$/, '');
    logo.src = `${siteUrl}/images/logo.webp`;
    logo.alt = `${BRAND.name || 'App'} Logo`;
    // Hide broken-image icon if the logo fails to load.
    logo.addEventListener('error', () => { logo.style.display = 'none'; }, { once: true });

    const title = document.createElement('h1');
    title.className = 'loading-title';
    title.textContent = BRAND.loadingTitle || BRAND.name || '';

    const subtitle = document.createElement('h2');
    subtitle.className = 'loading-subtitle';
    subtitle.textContent = BRAND.loadingSubtitle || BRAND.tagline || '';

    const statusContainer = document.createElement('div');
    statusContainer.className = 'loading-status';
    const statusText = document.createElement('p');
    statusText.id = 'loadingStatusText';
    statusText.setAttribute('role', 'status');
    statusText.setAttribute('aria-live', 'polite');
    statusText.textContent = MNTHEN_ANIMATIONS[0];
    statusContainer.appendChild(statusText);

    const progressTrack = document.createElement('div');
    progressTrack.className = 'loading-progress-track';
    progressTrack.setAttribute('role', 'progressbar');
    progressTrack.setAttribute('aria-label', 'Loading progress');
    progressTrack.setAttribute('aria-valuemin', '0');
    progressTrack.setAttribute('aria-valuemax', '100');
    progressTrack.setAttribute('aria-valuenow', '0');

    const progressBar = document.createElement('div');
    progressBar.className = 'loading-progress-bar';
    progressBar.id = 'loadingProgressBar';
    progressTrack.appendChild(progressBar);

    const noteContainer = document.createElement('div');
    noteContainer.className = 'loading-note';
    const noteText = document.createElement('p');
    noteText.textContent = 'Preparing your personalized historical tour.';
    noteContainer.appendChild(noteText);

    card.appendChild(logo);
    card.appendChild(title);
    card.appendChild(subtitle);
    card.appendChild(statusContainer);
    card.appendChild(progressTrack);
    card.appendChild(noteContainer);

    loadingMessage.appendChild(card);
    document.body.appendChild(loadingMessage);

    // Ease the bar toward 90% but never self-complete — the final 100%
    // is driven by fadeOutLoadingMessage() so the bar can't finish early
    // or crawl after the app is ready.
    const startedAt = performance.now();

    _loadingProgressInterval = setInterval(() => {
        const t = performance.now() - startedAt;
        const progress = 90 * (1 - Math.exp(-t / 1500));
        const clamped = Math.min(progress, 90);

        if (progressBar) progressBar.style.width = `${clamped}%`;
        progressTrack.setAttribute('aria-valuenow', String(Math.round(clamped)));

        // One status string per second for predictable pacing.
        if (statusText) {
            const idx = Math.min(Math.floor(t / 1000), MNTHEN_ANIMATIONS.length - 1);
            statusText.textContent = MNTHEN_ANIMATIONS[idx];
        }

        // Failsafe: if init never signals, don't trap the user forever.
        if (t > 15000 && !_loadingHideRequested) {
            _loadingHideRequested = true;
            tryHideLoadingMessage();
        }
    }, 100);

    if (memoryManager?.registerCleanupTask) {
        memoryManager.registerCleanupTask(() => {
            if (_loadingProgressInterval) {
                clearInterval(_loadingProgressInterval);
                _loadingProgressInterval = null;
            }
        });
    }
}

function tryHideLoadingMessage() {
    if (Date.now() >= loadingMessageMinDisplayTime) {
        fadeOutLoadingMessage();
    } else {
        const timeRemaining = loadingMessageMinDisplayTime - Date.now();
        createTrackedTimeout(fadeOutLoadingMessage, timeRemaining);
    }
}

function fadeOutLoadingMessage() {
    const loadingMessage = document.getElementById('loadingMessage');
    if (!loadingMessage) return;

    if (_loadingProgressInterval) {
        clearInterval(_loadingProgressInterval);
        _loadingProgressInterval = null;
    }

    // Snap progress to 100% on exit
    const progressBar = document.getElementById('loadingProgressBar');
    if (progressBar) progressBar.style.width = '100%';

    const distanceBox = cachedElements?.distanceBox || document.getElementById('distanceBox');
    if (distanceBox) distanceBox.classList.add('show');

    document.documentElement.removeAttribute('aria-busy');

    loadingMessage.style.opacity = '0';
    createTrackedTimeout(() => { loadingMessage.remove(); }, 500);
}

function hideLoadingMessage() {
    tryHideLoadingMessage();
}

 function updateAccuracyIndicator(accuracy) {
    const indicator = document.getElementById('accuracyIndicator');
    if (!indicator) return;

    // Invalid or negative readings are treated as poor signal.
    const valid = Number.isFinite(accuracy) && accuracy >= 0;

    indicator.classList.remove('accuracy-high', 'accuracy-medium', 'accuracy-low');

    else                              indicator.classList.add('accuracy-low');

/* ──────────────────────────────────────────────
   USER LOCATION INITIALIZATION
   ────────────────────────────────────────────── */
  function initializeUserLocation(position) {
    // Prefer a cached warm-start fix if it's fresher.
    position = window._consumeWarmupPosition?.(position) ?? position;

    if (!position?.coords) {
        handleLocationError(new Error('Invalid initial position'));
        return;
    }

    const { latitude: lat, longitude: lng } = position.coords;

    if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        handleLocationError(new Error('Invalid coordinates'));
        return;
    }

    // Already initialized — route through the normal update pipeline so
    // sensorFusion and dead reckoning stay in sync with the marker.
    if (window._initializationComplete) {
        if (typeof updateUserLocation === 'function') {
            updateUserLocation(position);
        } else {
            userMarker?.setLatLng([lat, lng]);
            map?.panTo([lat, lng], { animate: false });
        }
        return;
    }

    // Defer if another init is in flight so a fresher fix wins.
    if (window._initializationInProgress) {
        window._pendingInitPosition = position;
        return;
    }

    window._initializationInProgress = true;

    // One-time accessibility announcement. Fires here, not inside the retry
    // helper, so backoff retries don't re-announce while waiting.
    if (typeof announceToScreenReader === 'function') {
        const { accuracy } = position.coords;
        const msg = accuracy > 100
            ? `Location acquired with ${accuracy.toFixed(0)} meter accuracy. Map loading.`
            : 'Location acquired. Map ready for navigation.';
        announceToScreenReader(msg);
    }

    _initUserLocationAttempt(position);
}

function _scheduleLocationInitRecovery(err) {
    console.error('Location initialization error:', err);
    window._initializationInProgress = false;
    if (!window._initializationComplete) {
        window._huntStarted           = false;
        window._proximityCheckStarted = false;
    }
    
    // Permission denied can't be fixed by retrying — go straight to terminal popup.
    if (err?.code === 1) {
        window._initRecoveryAttempts = 0;
        if (typeof hideLoadingMessage === 'function') hideLoadingMessage();
        if (typeof showPopup === 'function') {
            showPopup('Location Error', 'Please allow access to your location to use this feature.');
        }
        return;
    }
    
    window._initRecoveryAttempts = (window._initRecoveryAttempts || 0) + 1;
    
    if (window._initRecoveryAttempts <= 5) {
        const backoffMs = Math.min(30000, Math.pow(2, window._initRecoveryAttempts) * 2000);
        console.log(`[Init] Retrying location init (attempt ${window._initRecoveryAttempts} of 5 in ${backoffMs}ms)`);
        
        createTrackedTimeout(() => {
            if (navigator.geolocation && !window._initializationComplete) {
                navigator.geolocation.getCurrentPosition(
                    initializeUserLocation,
                    (e) => _scheduleLocationInitRecovery(e),
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 } // Changed from 15000 to 30000
                );
            }
        }, backoffMs);
        return;
    }
    
    // Max attempts reached — single terminal popup, message tailored to the error code.
    window._initRecoveryAttempts = 0;
    if (typeof hideLoadingMessage === 'function') hideLoadingMessage();
    
    let errorMessage = 'Unable to get your location after multiple attempts. Please check your GPS settings and refresh the page.';
    if (err?.code !== undefined) {
        switch (err.code) {
            case 2:
                errorMessage = 'Your location is currently unavailable. Please check your GPS settings and refresh the page.';
                break;
            case 3:
                errorMessage = 'Getting your location took too long. Please check your GPS settings and refresh the page.';
                break;
        }
    }
    
    if (typeof showPopup === 'function') {
        showPopup('Location Error', errorMessage, 'error');
    }
}
        
function _initUserLocationAttempt(position) {
    // Self-contained validation in case this is ever called directly.
    if (!position?.coords) {
        window._initializationInProgress = false;
        _scheduleLocationInitRecovery(new Error('Invalid initial position'));
        return;
    }

    const { latitude: lat, longitude: lng, accuracy, heading, speed } = position.coords;

    if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
        Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        window._initializationInProgress = false;
        _scheduleLocationInitRecovery(new Error('Invalid coordinates'));
        return;
    }

    // Stale retry after success — just sync and bail.
    if (window._initializationComplete) {
        if (userMarker) {
            _neutralizeMarkerTransition();
            userMarker.setLatLng([lat, lng]);
        }
        if (map) map.panTo([lat, lng], { animate: false });
        window._initializationInProgress = false;
        return;
    }

    try {
        // Marker not ready yet — retry with exponential backoff.
        if (!userMarker) {
            window._markerRetryCount = (window._markerRetryCount || 0) + 1;

            if (window._markerRetryCount <= 5) {
                const delayMs = 150 * Math.pow(2, window._markerRetryCount - 1);
                createTrackedTimeout(() => {
                    const pos = window._pendingInitPosition || position;
                    window._pendingInitPosition = null;
                    _initUserLocationAttempt(pos);
                }, delayMs);
                return; // _initializationInProgress stays true
            }

            window._markerRetryCount = 0;
            _scheduleLocationInitRecovery(new Error('Map marker initialization failed'));
            return;
        }

        window._markerRetryCount = 0;
        window._hasEverAcquiredFix = true; 
        if (!map) throw new Error('Map not initialized');

        _neutralizeMarkerTransition();
        userMarker.setLatLng([lat, lng]);

        const targetZoom = (typeof getSpeedBasedZoom === 'function')
            ? (getSpeedBasedZoom(speed || 0) || 17)
            : 17;

        // pan.noMoveStart suppresses the synchronous 'movestart' that
        // Leaflet fires on setView. Without it, onInteractionStart runs
        // immediately and clears followUser before the user has touched
        // anything — the "floating off screen" bug.
        map.setView([lat, lng], targetZoom, {
            animate: false,
            pan: { noMoveStart: true }
        });

        window.followUser = true;
        window.isMapInteracting = false;

        // Seed a single position for a clean Kalman baseline.
        if (typeof seedPositionBuffer === 'function') {
            seedPositionBuffer({
                lat, lng,
                accuracy: accuracy || 20,
                timestamp: position.timestamp || Date.now(),
                heading: (heading != null && Number.isFinite(heading)) ? heading : null,
                speedMPS: Math.max(0, speed || 0),
            }, 1);
        }

        // Seed Kalman velocity independently so a throwing sensorFusion
        // module can't abort the rest of startup.
        try {
            const kf = window.sensorFusion?._kalmanFilter;
            if (kf) {
                const speedMPS = Math.max(0, speed || 0);
                if (speedMPS > 0.3 && heading != null && Number.isFinite(heading)) {
                    const rad = heading * Math.PI / 180;
                    kf.seedVelocity(speedMPS * Math.cos(rad), speedMPS * Math.sin(rad), 10.0);
                } else if (speedMPS > 0.3) {
                    // Speed known, heading unknown — high variance lets the
                    // first fixes snap velocity to truth without lag.
                    kf.seedVelocity(0, 0, 50.0);
                }
                // speed ≤ 0.3 m/s: zero-velocity init is correct.
            }
        } catch (kfErr) {
            console.warn('[Init] Kalman velocity seed failed:', kfErr);
        }

        if (typeof hideLoadingMessage === 'function') hideLoadingMessage();

        // Start location-based features independently so one failure
        // doesn't block the other.
        try {
            if (typeof startHunt === 'function' && !window._huntStarted) {
                window._huntStarted = true;
                startHunt();
            }
        } catch (huntErr) {
            console.error('[Init] startHunt failed:', huntErr);
            window._huntStarted = false;
        }

        try {
            if (typeof startIdleProximityCheck === 'function' && !window._proximityCheckStarted) {
                window._proximityCheckStarted = true;
                startIdleProximityCheck();
            }
        } catch (proxErr) {
            console.error('[Init] startIdleProximityCheck failed:', proxErr);
            window._proximityCheckStarted = false;
        }

        window._initializationComplete   = true;
        window._initializationInProgress = false;
        window._lastSuccessfulInit       = Date.now();
        window._initRecoveryAttempts     = 0;

        // Guard against a duplicate watch if this path is ever
        // re-entered after a watch is already running.
        try {
            if (!window.positionWatchId) {
                const watchId = startPositionUpdates();
                if (watchId === null) {
                    createTrackedTimeout(() => {
                        if (!window.positionWatchId) startPositionUpdates();
                    }, 3000);
                }
            }
        } catch (watchErr) {
            console.error('[Init] startPositionUpdates failed:', watchErr);
            createTrackedTimeout(() => {
                if (!window.positionWatchId) {
                    try { startPositionUpdates(); } catch (_) {}
                }
            }, 3000);
        }

        // Flush any position that queued during init.
        const pending = window._pendingInitPosition;
        if (pending) {
            window._pendingInitPosition = null;
            const pLat = pending?.coords?.latitude;
            const pLng = pending?.coords?.longitude;

        cancelAnimationFrame(window._countdownRafId);
        window._countdownRafId = null;
    }
    if (window._countdownNextFrame) {

        window._countdownNextFrame = null;
    }

function updateDistanceBox(forceUpdate = false, precalcUserPos = null, precalcClosestLocation = null, precalcClosestDistance = Infinity) {
    const distanceBox = cachedElements.distanceBox || document.getElementById('distanceBox');
    if (!distanceBox || document.hidden) return;

    if (!userMarker || !gameLocations || gameLocations.length === 0) {
        distanceBox.textContent = 'Initializing...';
        return;
    }

    let closestDistance;
    let closestLocation;
    let userPos;

    if (precalcUserPos && precalcClosestLocation && isFinite(precalcClosestDistance)) {
        userPos = precalcUserPos;
        closestDistance = precalcClosestDistance;
        closestLocation = precalcClosestLocation;
    } else {
        const latestPos = window.lastPosition;
        const userLatLng = latestPos
            ? { lat: latestPos.lat, lng: latestPos.lng }
            : (userMarker ? userMarker.getLatLng() : null);

        if (!userLatLng || !isFinite(userLatLng.lat) || !isFinite(userLatLng.lng)) {
            distanceBox.textContent = 'Initializing...';
            return;
        }

        let userLat = userLatLng.lat;
        let userLng = userLatLng.lng;

        // Only fall back to map center if map exists and position is genuinely 0,0
        if (userLat === 0 && userLng === 0 && map && typeof map.getCenter === 'function') {
            const center = map.getCenter();
            userLat = center.lat;
            userLng = center.lng;
        }

        closestDistance = Infinity;
        closestLocation = null;
        userPos = { lat: userLat, lng: userLng };

        const calcDist = typeof calculateDistance === 'function' ? calculateDistance : null;
        if (!calcDist) {
            console.warn('[DistanceBox] calculateDistance helper missing');
            return;
        }

        for (const location of gameLocations) {
            if (!location || typeof location.lat !== 'number' || typeof location.lng !== 'number') {
                continue;
            }
            const distance = calcDist(userPos, { lat: location.lat, lng: location.lng });
            if (isFinite(distance) && distance < closestDistance) {
                closestDistance = distance;
                closestLocation = location;
            }
        }

        if (!isFinite(closestDistance) || closestDistance === Infinity || !closestLocation) {
            distanceBox.textContent = 'Initializing...';
            return;
        }
    }

    window.lastClosestDistance = closestDistance;
    window.lastClosestLocation = closestLocation;

    if (typeof handleProximityAndAutoOpen === 'function') {
        handleProximityAndAutoOpen(userPos, performance.now(), closestLocation, closestDistance);
    }

    const rawDistanceFeet = closestDistance * 3.28084;
    const distanceFeet = Math.round(rawDistanceFeet);

    const PROXIMITY_THRESHOLD = (typeof CONFIG !== 'undefined' && CONFIG.DISTANCE_THRESHOLD)
        ? CONFIG.DISTANCE_THRESHOLD
        : 20;
    const isArrived = rawDistanceFeet <= PROXIMITY_THRESHOLD;

    let cooldownStatus = null;
    let isOnCooldown = false;
    if (isArrived && closestLocation?.id && window.cooldownManager) {
        cooldownStatus = window.cooldownManager.checkCooldown(closestLocation.id);
        isOnCooldown = !!cooldownStatus?.isOnCooldown;
    }

    // Stop countdown if we've moved out of range
    if (window.distanceBoxCountdownInterval && !isArrived) {
        _stopCountdown();

        if (window._cooldownExpiryTimeout) {
            clearTimeout(window._cooldownExpiryTimeout);
            window._cooldownExpiryTimeout = null;
            window._cooldownExpiryLocationId = null;
        }
        if (window.cooldownManager) {
            window.cooldownManager.clearToast?.();
        }
    }

    if (isArrived) {
        if (isOnCooldown && cooldownStatus?.remainingSeconds !== undefined) {
            if (!window.distanceBoxCountdownInterval) {
                let lastDisplayedText = null;

                const scheduleNext = () => {
                    if (!window.distanceBoxCountdownInterval) return;
                    window._countdownNextFrame = setTimeout(() => {
                        window._countdownNextFrame = null;
                        if (!window.distanceBoxCountdownInterval) return;
                        window._countdownRafId = requestAnimationFrame(tick);
                    }, 1000);
                };

                const tick = () => {
                    window._countdownRafId = null;

                    if (document.hidden) {
                        scheduleNext();
                        return;
                    }

                    const currentClosest = window.lastClosestLocation;
                    if (!currentClosest?.id || !window.cooldownManager) {
                        _stopCountdown();
                        return;
                    }

                    const status = window.cooldownManager.checkCooldown(currentClosest.id);

                    if (!status?.isOnCooldown) {
                        const arrivedText = 'Arrived.';
                        if (lastDisplayedText !== arrivedText) {
                            distanceBox.textContent = arrivedText;
                            lastDisplayedText = arrivedText;
                        }
                        window.currentlyArrived = true;

                        _stopCountdown();

                        if (window._cooldownExpiryTimeout) {
                            clearTimeout(window._cooldownExpiryTimeout);
                            window._cooldownExpiryTimeout = null;
                            window._cooldownExpiryLocationId = null;
                        }
                        return;
                    }

                    const mins = Math.floor(status.remainingSeconds / 60);
                    const secs = status.remainingSeconds % 60;
                    const newText = `Available in ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                    if (newText !== lastDisplayedText) {
                        distanceBox.textContent = newText;
                        lastDisplayedText = newText;
                    }

                    scheduleNext();
                };

                window.distanceBoxCountdownInterval = true;
                tick();

                const resumeOnVisible = () => {
                    if (!document.hidden && window.distanceBoxCountdownInterval) {
                        if (!window._countdownNextFrame && !window._countdownRafId) {
                            window._countdownRafId = requestAnimationFrame(tick);
                        }
                    }
                };

                if (window._countdownVisibilityHandler) {
                    document.removeEventListener('visibilitychange', window._countdownVisibilityHandler);
                }
                window._countdownVisibilityHandler = resumeOnVisible;
                document.addEventListener('visibilitychange', resumeOnVisible);

                if (cooldownStatus.remainingMs > 0) {
                    if (window._cooldownExpiryTimeout) {
                        clearTimeout(window._cooldownExpiryTimeout);
                    }
                    window._cooldownExpiryLocationId = closestLocation.id;
                    window._cooldownExpiryTimeout = setTimeout(() => {
                        window._cooldownExpiryTimeout = null;
                        const locId = window._cooldownExpiryLocationId;
                        window._cooldownExpiryLocationId = null;

                        const currentUserLatLng = userMarker?.getLatLng();
                        const loc = gameLocations?.find(l => l?.id === locId);
                        const calcDist = typeof calculateDistance === 'function' ? calculateDistance : null;

                        if (currentUserLatLng && loc && calcDist) {
                            const dist = calcDist(
                                { lat: currentUserLatLng.lat, lng: currentUserLatLng.lng },
                                { lat: loc.lat, lng: loc.lng }
                            );
                            if ((dist * 3.28084) <= PROXIMITY_THRESHOLD &&
                                typeof _openLocationPage === 'function') {
                                _openLocationPage(loc);
                            }
                        }
                    }, cooldownStatus.remainingMs + 200);
                }
            }
        } else {
            if (window.distanceBoxCountdownInterval) {
                _stopCountdown();
            }
            if (window._cooldownExpiryTimeout) {
                clearTimeout(window._cooldownExpiryTimeout);
                window._cooldownExpiryTimeout = null;
                window._cooldownExpiryLocationId = null;
            }

            distanceBox.textContent = 'Arrived.';
        }
    } else {
        const distanceText = rawDistanceFeet < 5280
            ? `${distanceFeet.toLocaleString()} feet`
            : `${(rawDistanceFeet / 5280).toFixed(2)} miles`;
        distanceBox.textContent = `Closest Stop: ${distanceText}`;

        _stopCountdown();
    }

    window.currentlyArrived = isArrived && !isOnCooldown;
}
        
/* ──────────────────────────────────────────────
   calculateDistance — haversine formula.
   ────────────────────────────────────────────── */
function calculateDistance(pos1OrLat, pos2OrLng, lat2, lng2) {
    var lat1, lng1, lat2_, lng2_;

    if (typeof lat2 === 'number' && typeof lng2 === 'number') {
        if (typeof pos1OrLat !== 'number' || typeof pos2OrLng !== 'number' ||
            !isFinite(pos1OrLat) || !isFinite(pos2OrLng) || !isFinite(lat2) || !isFinite(lng2)) {
            return Infinity;
        }
        lat1 = pos1OrLat;  lng1 = pos2OrLng;
        lat2_ = lat2;      lng2_ = lng2;
    } else {
        var pos1 = pos1OrLat;
        var pos2 = pos2OrLng;
        if (!pos1 || !pos2 ||
            typeof pos1.lat !== 'number' || typeof pos1.lng !== 'number' ||
            typeof pos2.lat !== 'number' || typeof pos2.lng !== 'number' ||
            !isFinite(pos1.lat) || !isFinite(pos1.lng) || !isFinite(pos2.lat) || !isFinite(pos2.lng)) {
            return Infinity;
        }
        lat1 = pos1.lat;   lng1 = pos1.lng;
        lat2_ = pos2.lat;  lng2_ = pos2.lng;
    }

    var toRad = Math.PI / 180;
    var lat1r = lat1 * toRad;
    var lat2r = lat2_ * toRad;
    var dLat  = (lat2_ - lat1) * toRad;
    var dLng  = (lng2_ - lng1) * toRad;

    var sinDLat = Math.sin(dLat * 0.5);
    var sinDLng = Math.sin(dLng * 0.5);

    var a = sinDLat * sinDLat +
            Math.cos(lat1r) * Math.cos(lat2r) * sinDLng * sinDLng;

    if (a > 1) a = 1;
    if (a < 0) a = 0;  // Guard against negative floating point drift

    return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* ──────────────────────────────────────────────
   handleLocationError — Handler for geolocation errors from calls OUTSIDE the init-recovery
   system (e.g. a standalone "locate me" action, watch errors). 
   ────────────────────────────────────────────── */
function handleLocationError(error) {
    console.warn("Error getting user location:", error);
    const localRetryCount = error?._retryCount || 0;

    // Permission denied — no retry can fix this, so fail fast.
    if (error?.code === 1) {
        if (typeof hideLoadingMessage === 'function') hideLoadingMessage();
        showPopup("Location Error", "Please allow access to your location to use this feature.");
        if (typeof onLocationFailure === 'function') onLocationFailure(error);
        return;
    }

    if (window.positionWatchId != null) {
        console.log('[GPS] Watch active — suppressing one-shot retry (error code ' + error?.code + ')');
        return;
    }

    const maxRetries = CONFIG?.MAX_RETRIES ?? 3;
    const retryDelay = CONFIG?.RETRY_DELAY ?? 1000;

    if (localRetryCount < maxRetries) {
        const nextRetryCount = localRetryCount + 1;
        const backoffMs = Math.min(10000, retryDelay * Math.pow(2, nextRetryCount - 1));
        console.log(`Retrying to get location (Attempt ${nextRetryCount} of ${maxRetries} in ${backoffMs}ms)`);

        createTrackedTimeout(() => {
            if (!navigator.geolocation) {
                console.warn('Geolocation API not available');
                return;
            }

            const recoveryOpts = typeof getGeolocationOptions === 'function'
                ? getGeolocationOptions(nextRetryCount)
                : { enableHighAccuracy: true, timeout: 30000, maximumAge: 10000 };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    console.log("Location retrieved successfully after retry");
                    if (typeof hideLoadingMessage === 'function') hideLoadingMessage();
                    updateUserLocation(position, true);
                    if (typeof startPositionUpdates === 'function' && !window.positionWatchId) {
                        startPositionUpdates();
                    }
                },
                (err) => {
                    err._retryCount = nextRetryCount;
                    handleLocationError(err);
                },
                recoveryOpts
            );
        }, backoffMs);
        return;
    }

    if (typeof hideLoadingMessage === 'function') hideLoadingMessage();
    let errorMessage = "An error occurred while getting your location.";
    if (error?.code !== undefined) {
        switch (error.code) {
            case 1:
                errorMessage = "Please allow access to your location to use this feature.";
                break;
            case 2:
                errorMessage = "Your location is currently unavailable. Please try again later.";
                break;
            case 3:
                errorMessage = "Getting your location took too long. Please try again.";
                break;
            case 0:
                errorMessage = "Unable to determine your location. Please check your device settings and try again.";
                break;
        }
    }
    showPopup("Location Error", errorMessage);
    if (typeof onLocationFailure === 'function') onLocationFailure(error);
}

    function showPopup(title, message, type = "info", callback = null) {
        document.querySelectorAll(".popup-overlay").forEach(p => p.remove());
    
        const overlay = document.createElement("div");
        overlay.className = "popup-overlay";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-label", title);
    
        const popupContainer = document.createElement("div");
        popupContainer.className = "popup-container";
    
        const titleElement = document.createElement("h3");
        titleElement.textContent = title;
    
        const messageElement = document.createElement("p");
        messageElement.textContent = message;
    
        const closeButton = document.createElement("button");
        closeButton.textContent = "Close";
        closeButton.className = "popup-close-btn";
        closeButton.setAttribute("data-type", type);
    
        function closePopup() {
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.remove();
                if (window._popupOriginalOverflow !== undefined) {
                    document.body.style.overflow = window._popupOriginalOverflow;
                    window._popupOriginalOverflow = undefined;
                }
                if (typeof callback === 'function') {
                    callback();
                }
            }, 150);
        }
    
        closeButton.addEventListener("click", closePopup);
        overlay.addEventListener("click", (e) => {
            if (e.target === overlay) closePopup();
        });
    
        overlay.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                e.preventDefault();
                closePopup();
            }
            if (e.key === "Tab") {
                e.preventDefault();
                closeButton.focus();
            }
        });
    
        if (window._popupOriginalOverflow === undefined) {
            window._popupOriginalOverflow = document.body.style.overflow || "";
        }
        document.body.style.overflow = "hidden";
    
        popupContainer.appendChild(titleElement);
        popupContainer.appendChild(messageElement);
        popupContainer.appendChild(closeButton);
        overlay.appendChild(popupContainer);
        document.body.appendChild(overlay);
    
        overlay.style.opacity = "0";
        requestAnimationFrame(() => {
            overlay.style.opacity = "1";
        });
    
        closeButton.focus();
    }

        btn.disabled = false;
        btn.style.backgroundColor = 'white';
        btn.style.color = 'var(--primary-color)';
        return;
    }

    // Set state BEFORE the map operation so the synchronous
    // movestart (if any) sees the correct values.
    window.followUser       = true;
    window.isMapInteracting = false;

    // Instant snap, not an animated pan.  DR's _snapViewport calls
    // map.setView(animate:false) every frame in centered mode, which
    // cancels any in-flight animated setView on the first frame —
    // producing a visible stutter. 
    map.setView([ll.lat, ll.lng], 17, {
        animate: false,
        pan: { noMoveStart: true }
    });

    // Kick DR so it picks up the centered viewport immediately
    // rather than waiting for the next GPS fix.
    if (window.deadReckoning && typeof window.deadReckoning.forceUpdate === 'function') {
        window.deadReckoning.forceUpdate();
    }

    announceToScreenReader('Map re-centred on your location');

    clearTimeout(recenterTimer);
    recenterTimer = setTimeout(() => {
        btn.style.backgroundColor = 'white';
        btn.style.color = 'var(--primary-color)';
        btn.disabled = false;
        recenterTimer = null;
    }, 500);
}

/* ---------- 2-MINUTE LOCATION COOLDOWN ---------- */
const COOLDOWN_PERIOD_MS = 2 * 60 * 1000;
const STORAGE_KEY = 'locationCooldowns';
const DEBOUNCE_TIME_MS = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 500 : 300;
const CLEANUP_INTERVAL_MS = 60 * 1000;
const MAP_RESET_CHECK_INTERVAL_MS = 5000;

class LocationCooldownManager {
  constructor() {
    this.cooldowns = this.loadFromStorage();
    this.currentLocationId = null;
    this.lastActionTime = 0;
    this.resetCooldownIds = new Set();
    this.wasOverSpeedThreshold = false;
    this._monitoringLocationId = null;
    this._announcedLocations = new Set();
    this._closeFuncPoll = null;
    this._saveTimeout = null;
    
    this._proximityCache = {};
    this._locationCoordCache = {};
    this._lastProximityResult = false;
    this._MAX_PROXIMITY_CACHE_SIZE = 50;
    
    this._sessionPrefs = this._loadSessionPrefs();
    this._prefsChecked = new Set();

    this.cleanupInterval = null;
    this.mapResetInterval = null;
    this.toastInterval = null;
    this.activeToast = null;

    this.cleanupExpiredCooldowns();
    this.startPeriodicCleanup();
    this.startMapResetMonitoring();
    this.patchCloseFunctions();
    this.patchCreateBottomActionBar();
  }

  _loadSessionPrefs() {
    try {
      const raw = sessionStorage.getItem('cooldownSessionPrefs');
      if (!raw) return { hideCooldownUI: false };
      const parsed = JSON.parse(raw);
      return { hideCooldownUI: !!parsed.hideCooldownUI };
    } catch (e) {
      console.warn('Failed to load session prefs:', e);
      return { hideCooldownUI: false };
    }
  }

  _saveSessionPrefs() {
    try {
      sessionStorage.setItem('cooldownSessionPrefs', JSON.stringify(this._sessionPrefs));
    } catch (e) {
      console.error('Failed to save session prefs:', e);
    }
  }

  clearSessionPrefs() {
    sessionStorage.removeItem('cooldownSessionPrefs');
    this._sessionPrefs = { hideCooldownUI: false };
    this._prefsChecked.clear();
  }

  checkCooldown(locationId) {
    if (locationId == null) {
      return { isOnCooldown: false, remainingMs: 0, remainingSeconds: 0 };
    }

    const id = String(locationId);
    const startTime = this.cooldowns[id];

    if (!startTime) {
      return { isOnCooldown: false, remainingMs: 0, remainingSeconds: 0 };
    }

    const elapsed = Date.now() - startTime;

    if (!isFinite(elapsed) || elapsed < 0) {
      this._clearCooldownState(id);
      return { isOnCooldown: false, remainingMs: 0, remainingSeconds: 0 };
    }

    if (elapsed >= COOLDOWN_PERIOD_MS) {
      this._clearCooldownState(id);
      return { isOnCooldown: false, remainingMs: 0, remainingSeconds: 0 };
    }

    const remainingMs = COOLDOWN_PERIOD_MS - elapsed;
    return {
      isOnCooldown: true,
      remainingMs: Math.max(0, remainingMs),
      remainingSeconds: Math.max(0, Math.ceil(remainingMs / 1000)),
    };
  }

  _clearCooldownState(id) {
    delete this.cooldowns[id];
    this.resetCooldownIds.delete(id);
    this._announcedLocations.delete(id);
    this._prefsChecked.delete(id);
    this.saveToStorage();
  }

  enterLocation(locationId) {
    if (locationId == null) {
      return { success: false, reason: 'invalid_id', message: 'Invalid location ID' };
    }
    const id = String(locationId);
    const now = Date.now();
    if (now - this.lastActionTime < DEBOUNCE_TIME_MS) {
      return { success: false, reason: 'debounced', message: 'Action too rapid' };
    }
    this.lastActionTime = now;
    if (this.currentLocationId === id) {
      return { success: false, reason: 'already_inside', message: 'Already in this location' };
    }
    const status = this.checkCooldown(id);
    if (status.isOnCooldown) {
      return {
        success: false,
        reason: 'on_cooldown',
        message: 'This location cannot be revisited for two minutes',
        remainingMs: status.remainingMs,
        remainingSeconds: status.remainingSeconds,
        locationId: id,
      };
    }
    this.currentLocationId = id;
    this.resetCooldownIds.delete(id);
    return { success: true, reason: 'allowed', message: 'Location entry allowed' };
  }

  leaveLocation(locationId = null) {
    const id = locationId ? String(locationId) : this.currentLocationId;
    if (!id || id === 'null' || id === 'undefined') return;

    const wasCurrentLocation = this.currentLocationId === id;
    if (this.currentLocationId === id) this.currentLocationId = null;

    if (!wasCurrentLocation) return;

    if (this.cooldowns[id]) {
        const status = this.checkCooldown(id);
        if (status.isOnCooldown) return;
    }

    this.cooldowns[id] = Date.now();
    this._announcedLocations.delete(id);
    this._prefsChecked.delete(id);
    this.saveToStorage();
  }

  startMapResetMonitoring() {
    this.mapResetInterval = setInterval(() => {
      this.checkAndResetMap();
    }, MAP_RESET_CHECK_INTERVAL_MS);
  }

  checkAndResetMap() {
    const now = Date.now();
    let shouldReset = false;
    let resetReason = null;

    if (typeof window.currentSpeed === 'number' && window.currentSpeed > 6) {
      if (!this.wasOverSpeedThreshold) {
        shouldReset = true;
        resetReason = 'speed_threshold';
        this.wasOverSpeedThreshold = true;
      }
    } else {
      this.wasOverSpeedThreshold = false;
    }

    if (!shouldReset) {
      const cooldownIds = Object.keys(this.cooldowns);
      if (cooldownIds.length > 0) {
        for (const id of cooldownIds) {
          if (this.resetCooldownIds.has(id)) continue;

          const status = this.checkCooldown(id);
          if (!status.isOnCooldown && this.isWithinThreshold(id)) {
            shouldReset = true;
            resetReason = 'cooldown_expired';
            this.resetCooldownIds.add(id);
            break;
          }
        }
      }
    }

    if (shouldReset) {
      console.log(`Map reset triggered: ${resetReason}`);
      this.resetMapToUser();
    }
  }

  resetMapToUser() {
    if (typeof window.updateUserLocation === 'function' && window.lastPosition) {
      const fakePosition = {
        coords: {
          latitude: window.lastPosition.lat,
          longitude: window.lastPosition.lng,
          accuracy: window.lastPosition.accuracy || 20,
          // ── Use existing m/s value instead of converting from MPH ──
          speed: window.lastPosition?.speedMPS || 0,
          heading: window.lastPosition.heading || null
        },
        timestamp: Date.now()
      };

      updateUserLocation(fakePosition, false);

      window.followUser = true;
      window.isMapInteracting = false;

      window.blockSpeedZoom = true;
      if (typeof window.blockProximityZoom !== 'undefined') {
        window.blockProximityZoom = true;
      }
      
      setTimeout(() => {
        window.blockSpeedZoom = false;
        if (typeof window.blockProximityZoom !== 'undefined') {
          window.blockProximityZoom = false;
        }
      }, 2000);

    } else {
      try {
        if (typeof window.recenterMap === 'function') {
          window.recenterMap();
        } else if (window.map && window.userMarker) {
          const userPos = window.userMarker.getLatLng();
          if (userPos && window.map.setView) {
            window.map.flyTo(userPos, window.map.getZoom?.() || 16, {
              animate: true,
              duration: 1.0,
              easeLinearity: 0.25
            });
          }
        }

        window.isMapInteracting = false;
        window.followUser = true;
      } catch (e) {
        console.error('Fallback map reset failed:', e);
      }
    }
  }

  formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  _setProximityCache(cacheKey, result) {
    if (Object.keys(this._proximityCache).length >= this._MAX_PROXIMITY_CACHE_SIZE) {
      let oldestKey = null;
      let oldestTime = Infinity;
      for (const key in this._proximityCache) {
        if (this._proximityCache[key].timestamp < oldestTime) {
          oldestTime = this._proximityCache[key].timestamp;
          oldestKey = key;
        }
      }
      if (oldestKey) delete this._proximityCache[oldestKey];
    }
    this._proximityCache[cacheKey] = { result, timestamp: Date.now() };
  }

  isWithinThreshold(locationId, _skipCache = false) {
    const now = Date.now();
    const cacheKey = String(locationId);

    if (!_skipCache && this._proximityCache[cacheKey]) {
      const cached = this._proximityCache[cacheKey];
      if (now - cached.timestamp < 500) {
        return cached.result;
      }
    }

    try {
      let lat, lng;

      if (this._locationCoordCache[cacheKey]) {
        lat = this._locationCoordCache[cacheKey].lat;
        lng = this._locationCoordCache[cacheKey].lng;
      } else {
        let location = null;
        const sources = [window.gameLocations, window.locations];
        for (const source of sources) {
          if (Array.isArray(source)) {
            location = source.find(loc => loc?.id === locationId);
            if (location) break;
          }
        }
        if (!location && window.locationsMap && typeof window.locationsMap === 'object') {
          location = Object.values(window.locationsMap).find(loc => loc?.id === locationId);
        }

        if (!location) {
          this._setProximityCache(cacheKey, false);
          return false;
        }

        lat = parseFloat(location.lat);
        lng = parseFloat(location.lng);

        if (isFinite(lat) && isFinite(lng)) {
          this._locationCoordCache[cacheKey] = { lat, lng };
        }
      }

      if (!isFinite(lat) || !isFinite(lng)) {
        this._setProximityCache(cacheKey, false);
        return false;
      }

      if (typeof calculateDistance !== 'function' || !window.userMarker) {
        this._setProximityCache(cacheKey, false);
        return false;
      }

      const userPos = window.userMarker.getLatLng();
      if (!userPos || !isFinite(userPos.lat) || !isFinite(userPos.lng)) {
        this._setProximityCache(cacheKey, false);
        return false;
      }

      // ── CalculateDistance returns meters, convert to feet before comparing ──
      const distanceMeters = calculateDistance(userPos.lat, userPos.lng, lat, lng);
      if (!isFinite(distanceMeters) || distanceMeters < 0) {
        this._setProximityCache(cacheKey, false);
        return false;
      }

      const distanceFeet = distanceMeters * 3.28084;

      const threshold = (typeof CONFIG?.DISTANCE_THRESHOLD === 'number')
        ? CONFIG.DISTANCE_THRESHOLD
        : 20;

      const result = distanceFeet <= threshold;
      this._setProximityCache(cacheKey, result);
      return result;
    } catch (e) {
      console.error('Error in isWithinThreshold:', e);
      this._setProximityCache(cacheKey, false);
      return false;
    }
  }

  notifyUserWithCountdown(locationId, remainingSeconds) {
    if (this._monitoringLocationId === locationId) {
        return;
    }

    this.clearToastInterval();
    this._monitoringLocationId = locationId;

    if (this._sessionPrefs.hideCooldownUI) {
        this._prefsChecked.add(locationId);
    }

    const updateCheck = () => {
        if (this._monitoringLocationId !== locationId) {
            this.clearToastInterval();
            return;
        }

        const status = this.checkCooldown(locationId);

        if (!status.isOnCooldown) {
            const isNearby = this.isWithinThreshold(locationId, true);
            this._handleCooldownExpired(locationId, isNearby);
            return;
        }
    };

    updateCheck();
    this.toastInterval = setInterval(updateCheck, 1000);
  }

  _handleCooldownExpired(locationId, isNearby) {
    this.clearToastInterval();
    this._monitoringLocationId = null;
    this._prefsChecked.delete(locationId);

    if (isNearby) {
        const location = window.gameLocations?.find(loc => loc?.id === locationId) ||
                         window.locations?.find(loc => loc?.id === locationId) ||
                         Object.values(window.locationsMap || {}).find(loc => loc?.id === locationId);

        if (location && typeof window._openLocationPage === 'function') {
            console.log('[Cooldown] Expired while user nearby - auto-opening:', locationId);
            window._openLocationPage(location);
        }
    }
  }

  clearToast() {
    this.clearToastInterval();
    this._monitoringLocationId = null;
  }

  clearToastInterval() {
    if (this.toastInterval) {
      clearInterval(this.toastInterval);
      this.toastInterval = null;
    }
  }

  loadFromStorage() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return {};
      const parsed = JSON.parse(data);
      return typeof parsed === 'object' && parsed !== null ? parsed : {};
    } catch (e) {
      console.warn('Failed to load cooldowns:', e);
      return {};
    }
  }

  saveToStorage() {
    if (this._saveTimeout) clearTimeout(this._saveTimeout);
    this._saveTimeout = setTimeout(() => {
      this._saveTimeout = null;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.cooldowns));
      } catch (e) {
        console.error('Failed to save cooldowns:', e);
      }
    }, 0);
  }

  cleanupExpiredCooldowns() {
    const now = Date.now();
    for (const id of [...Object.keys(this.cooldowns)]) {
      const startTime = this.cooldowns[id];
      if (!startTime) continue;
      
      const elapsed = now - startTime;
      if (!isFinite(elapsed) || elapsed < 0 || elapsed >= COOLDOWN_PERIOD_MS) {
        this._clearCooldownState(id);
      }
    }
  }

  startPeriodicCleanup() {
    this.cleanupInterval = setInterval(() => {
      this.cleanupExpiredCooldowns();
    }, CLEANUP_INTERVAL_MS);
  }

  patchCloseFunctions() {
    const names = ['closeLocationHunt', 'closeLocation', 'hideLocationHunt', 'exitLocation'];

    for (const name of names) {
      if (window[name] && !window[name].__patched) {
        this.patchCloseFunction(name);
      }
    }

    const manager = this;
    let attempts = 0;
    this._closeFuncPoll = setInterval(() => {
      let allPatched = true;
      for (const name of names) {
        if (window[name] && !window[name].__patched) {
          manager.patchCloseFunction(name);
        }
        if (!window[name] || !window[name].__patched) {
          allPatched = false;
        }
      }
      if (allPatched || ++attempts >= 20) {
        clearInterval(manager._closeFuncPoll);
        manager._closeFuncPoll = null;
      }
    }, 500);
  }

  patchCloseFunction(funcName) {
    const original = window[funcName];
    const manager = this;
    window[funcName] = function(locationId) {
      if (manager.currentLocationId) manager.leaveLocation(manager.currentLocationId);
      else if (locationId) manager.leaveLocation(locationId);
      return original.call(this, locationId);
    };
    window[funcName].__patched = true;
    window[funcName].__original = original;
  }

  patchCreateBottomActionBar() {
    if (!window.createBottomActionBar || window.createBottomActionBar.__patched) return;
    const original = window.createBottomActionBar;
    const manager = this;
    window.createBottomActionBar = function(location) {
      const bar = original.call(this, location);
      if (bar && location?.id) {
        const originalOnClick = bar.onclick;
        bar.onclick = function(e) {
          manager.leaveLocation(location.id);
          return originalOnClick?.call(this, e);
        };
      }
      return bar;
    };
    window.createBottomActionBar.__patched = true;
    window.createBottomActionBar.__original = original;
  }

  destroy() {
    this._destroyed = true;
    
    if (this.cleanupInterval) clearInterval(this.cleanupInterval);
    if (this.mapResetInterval) clearInterval(this.mapResetInterval);
    if (this._closeFuncPoll) { clearInterval(this._closeFuncPoll); this._closeFuncPoll = null; }
    if (this._saveTimeout) { clearTimeout(this._saveTimeout); this._saveTimeout = null; }
    
    this.clearToast();
    
    const patchedNames = ['closeLocationHunt', 'closeLocation', 'hideLocationHunt', 'exitLocation', 'createBottomActionBar'];
    for (const name of patchedNames) {
      const fn = window[name];
      if (fn?.__patched && fn.__original) {
        window[name] = fn.__original;
        delete fn.__original;
        delete fn.__patched;
      }
    }
    
    this.currentLocationId = null;
    this.resetCooldownIds.clear();
    this._monitoringLocationId = null;
    this._announcedLocations.clear();
    this._prefsChecked.clear();

    // ── Null the global reference so external code knows it's gone ──
    window.cooldownManager = null;
  }

  resetSessionPreferences() { this.clearSessionPrefs(); }
  isUIHiddenByPreference() { return this._sessionPrefs.hideCooldownUI; }
  getRemainingTime(locationId) { return this.checkCooldown(locationId).remainingSeconds; }
  
  getAllCooldowns() {
    const out = {};
    for (const id of Object.keys(this.cooldowns)) {
      const rem = this.getRemainingTime(id);
      if (rem > 0) out[id] = rem;
    }
    return out;
  }
  
  clearCooldown(locationId) {
    if (locationId == null) return;
    const id = String(locationId);
    delete this.cooldowns[id];
    this.resetCooldownIds.delete(id);
    this._announcedLocations.delete(id);
    this._prefsChecked.delete(id);
    this.saveToStorage();
  }
  
  clearAllCooldowns() {
    this.cooldowns = {};
    this.resetCooldownIds.clear();
    this._announcedLocations.clear();
    this._prefsChecked.clear();
    this.saveToStorage();
  }
  
  getCurrentLocation() { return this.currentLocationId; }
}

if (typeof window !== 'undefined') {
  if (window.cooldownManager) window.cooldownManager.destroy();
  window.cooldownManager = new LocationCooldownManager();
}

window._openLocationPage = function(location) {
  if (!location?.id) return;
  
  if (window.cooldownManager) {
    const status = window.cooldownManager.checkCooldown(location.id);
    
    if (status.isOnCooldown) {
      window.cooldownManager.notifyUserWithCountdown(location.id, status.remainingSeconds);
      return;
    }
    
    if (window.cooldownManager.currentLocationId === String(location.id)) {
      const lochuntContainer = document.querySelector('.lochunt-container');
      // ── Use computed style instead of inline style ──
      const pageIsActuallyOpen = lochuntContainer && 
          getComputedStyle(lochuntContainer).display !== 'none';
      if (!pageIsActuallyOpen) {
        window.cooldownManager.currentLocationId = null;
      }
    }
    
    const result = window.cooldownManager.enterLocation(location.id);
    if (!result.success) return;
  }
  
  if (typeof window.showLocationHunt === 'function') {
    window.showLocationHunt(location, { source: 'proximity' });
  }
};
        
function showLocationHunt(location, options) {
    // options.source: 'proximity' | 'manual' (default: 'manual')
    // Proximity-triggered opens already have per-location debounce in
    // _handleTriggerZone. Only apply the global debounce for manual
    // (tap) interactions to prevent double-taps on mobile.
    const source = (options && options.source) || 'manual';
    const now = Date.now();

    // Per-location debounce instead of global.
    // Prevents the same location from being opened twice in rapid
    // succession (double-tap), but allows different locations to
    // open immediately one after another.
    if (!window._showLocationHuntLastCall) {
        window._showLocationHuntLastCall = {};
    }

    const locationId = location ? location.id : 'unknown';
    const lastCallForThisLocation = window._showLocationHuntLastCall[locationId] || 0;

    // Only apply debounce for manual (tap) interactions.
    // Proximity opens have their own debounce in _handleTriggerZone.
    const DEBOUNCE_TIME = (source === 'manual' && typeof DEBOUNCE_TIME_MS !== 'undefined')
        ? DEBOUNCE_TIME_MS
        : 0;

    if (now - lastCallForThisLocation < DEBOUNCE_TIME) {
        return;
    }

    window._showLocationHuntLastCall[locationId] = now;

    // Set location state
    window.lastVisitedLocationId = location.id;
    window.isLocationHuntVisible = true;
    window.isMapInteracting = true;

    // Clean up any previous audio player instance before replacing the DOM
    if (typeof window.audioPlayerCleanup === 'function') {
        window.audioPlayerCleanup();
        window.audioPlayerCleanup = null;
    }

    // Clear any saved audio position so the new location always starts fresh
    try { localStorage.removeItem('audioPosition'); } catch (e) {}

    // Get or create container
    const lochuntContainer = cachedElements.lochuntContainer || document.querySelector('.lochunt-container');
    if (!lochuntContainer) {
        return;
    }

    lochuntContainer.innerHTML = '';
    lochuntContainer.style.display = 'flex';
    lochuntContainer.classList.add('fade-in');

    // Announce to screen readers
    if (typeof announceToScreenReader === 'function') {
        announceToScreenReader(`Opened location: ${location.name}`);
    }

    // Create scrollable content container
    const scrollableContent = document.createElement('div');
    scrollableContent.classList.add('lochunt-scrollable');

    // Create and append location image
    const locationImage = document.createElement('img');
    locationImage.src = location.image;
    locationImage.alt = location.name;
    locationImage.classList.add('lochunt-image');
    locationImage.loading = 'eager';
    scrollableContent.appendChild(locationImage);

    // Create content container
    const contentContainer = document.createElement('div');
    contentContainer.classList.add('lochunt-content', 'lochunt-detail-content');

    // Create location info section
    const locationInfo = document.createElement('div');
    locationInfo.classList.add('lochunt-info');

    const locationName = document.createElement('h1');
    locationName.id = 'locationTitle';
    locationName.textContent = location.name;
    locationName.classList.add('lochunt-title');

    const locationCity = document.createElement('p');
    locationCity.textContent = location.city;
    locationCity.classList.add('lochunt-city');

    const locationCreator = document.createElement('p');
    locationCreator.id = 'locationCreator';
    locationCreator.textContent = `Created by: ${location.creator}`;
    locationCreator.classList.add('lochunt-creator');

    locationInfo.appendChild(locationName);
    locationInfo.appendChild(locationCity);
    locationInfo.appendChild(locationCreator);
    contentContainer.appendChild(locationInfo);

    if (typeof createAudioPlayer === 'function') {
        const audioPlayerContainer = createAudioPlayer(location.audio);
        contentContainer.appendChild(audioPlayerContainer);
    }

    scrollableContent.appendChild(contentContainer);
    lochuntContainer.appendChild(scrollableContent);

    if (typeof createBottomActionBar === 'function') {
        const bottomActionBar = createBottomActionBar(location);
        lochuntContainer.appendChild(bottomActionBar);
    }

    requestAnimationFrame(() => {
        if (typeof initAudioPlayer === 'function') {
            window.audioPlayerCleanup = initAudioPlayer();
        }
    });

    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        const userPos = userMarker ? userMarker.getLatLng() : null;
        if (userPos && gameLocations) {
            navigator.serviceWorker.controller.postMessage({
                type: 'PREFETCH_AUDIO',
                data: {
                    userLocation: { lat: userPos.lat, lng: userPos.lng },
                    locations: gameLocations
                }
            });
        }
    }
}

function createAudioPlayer(audioSrc) {
    const audioPlayerContainer = document.createElement('div');
    audioPlayerContainer.classList.add('audio-player');

    const audio = document.createElement('audio');
    audio.id = 'locationAudio';
    audio.src = audioSrc;
    audio.preload = 'metadata'; // 'Metadata' prevents auto-downloading huge files on mobile data

    const audioProgress = document.createElement('div');
    audioProgress.classList.add('audio-progress');

    const progressContainer = document.createElement('div');
    progressContainer.classList.add('progress');

function createBottomActionBar(location) {
    const actionBar = document.createElement('div');
    actionBar.className = 'location-action-bar';
    const support     = (location && location.support)      ? location.support      : '';
    const supportLink = (location && location.support_link) ? location.support_link : '';
    // Sanitize the URL to prevent XSS (e.g. javascript: protocol)
    let safeSupportLink = '';
    if (supportLink) {
        try {
            const url = new URL(supportLink);
            if (url.protocol === "http:" || url.protocol === "https:") {
                safeSupportLink = url.href;
            }
        } catch (e) {
            // Invalid URL, ignore
        }
    }
    // Escape the support text to prevent HTML injection
    const escapeHTML = (str) => typeof str === 'string' 
        ? str.replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[match])) 
        : '';
    const safeSupport = escapeHTML(support);
    const supportHTML = safeSupport
        ? safeSupportLink
            ? `<span>Supported by <a href="${safeSupportLink}" target="_blank" rel="noopener noreferrer">${safeSupport}</a></span>`
            : `<span>Supported by ${safeSupport}</span>`
        : '';
    const feedbackEmail = (window.BRAND && window.BRAND.feedbackEmail) ? window.BRAND.feedbackEmail : '';
    const safeFeedbackEmail = escapeHTML(feedbackEmail);
    actionBar.innerHTML = `
        <button class="source-info-button btn btn-sm" aria-label="Image source information">
            <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
        </button>
        <div class="support-info">${supportHTML}</div>
        <a href="mailto:${safeFeedbackEmail}?subject=Feedback" target="_blank" rel="noopener noreferrer" class="feedback-email-button" aria-label="Send feedback email">
            <i class="bi bi-envelope-fill" aria-hidden="true"></i>
        </a>
    `;
    actionBar.querySelector('.source-info-button').onclick = () => {
        showSourcePopup(
            'Image Source',
            (location && location.imageSource) ? location.imageSource : 'Image source information is not available'
        );
    };
    return actionBar;
}
        
function showSourcePopup(title, content) {
    const existingPopup = document.getElementById('sourceInfoPopup');
    if (existingPopup) {
        existingPopup.remove();
    }

    const overlay = document.createElement('div');
    overlay.id = 'sourceInfoPopup';
    overlay.classList.add('source-info-popup-overlay');
    overlay.setAttribute('role', 'dialog');          
    overlay.setAttribute('aria-modal', 'true');      
    overlay.setAttribute('aria-label', title);       

    const popup = document.createElement('div');
    popup.classList.add('source-info-content');

    const popupTitle = document.createElement('h3');
    popupTitle.textContent = title;
    popupTitle.classList.add('source-popup-title');

    const popupContent = document.createElement('div');
    popupContent.classList.add('source-popup-content');
    popupContent.textContent = content;

    // Unified close function to handle all cleanup
    const closePopup = () => {
        document.body.style.overflow = "";              // Restore background scroll
        document.removeEventListener('keydown', handleEscape); // Clean up escape listener
        overlay.remove();
    };

    // Escape key handler
    const handleEscape = (e) => {
        if (e.key === 'Escape') {
            closePopup();
        }
    };

    const closeButton = document.createElement('button');
    closeButton.textContent = 'Close';
    closeButton.classList.add('source-close-button', 'btn');
    closeButton.addEventListener('click', closePopup);

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) { closePopup(); }
    });

    popup.appendChild(popupTitle);
    popup.appendChild(popupContent);
    popup.appendChild(closeButton);
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    
    // Lock background scrolling when popup is open
    document.body.style.overflow = "hidden";
    
    // Add escape key listener
    document.addEventListener('keydown', handleEscape);

    requestAnimationFrame(() => {
        overlay.classList.add('show');
    });

    // Auto-focus the close button for keyboard/screen reader users
    closeButton.focus();
}
        
function initAudioPlayer() {
    const audio             = document.getElementById('locationAudio');
    const playPauseBtn      = document.getElementById('playPauseBtn');
    const rewindBtn         = document.getElementById('rewindBtn');
    const forwardBtn        = document.getElementById('forwardBtn');
    const progressBar       = document.getElementById('progressBar');
    const progressContainer = document.querySelector('.progress');
    const currentTimeSpan   = document.getElementById('currentTime');
    const durationSpan      = document.getElementById('duration');

    if (!audio || !playPauseBtn || !progressBar) {
        console.error('[Audio] Required elements missing');
        return function noop() {};
    }

    // ─── Platform Detection ───────────────────────────────────────────────
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    // Removed unused isAndroid variable

    // ─── Save original source ─────────────────────────────────────────────
    if (audio.src && audio.src !== window.location.href && !audio.dataset.originalSrc) {
        audio.dataset.originalSrc = audio.src;
    }

    // ─── State ────────────────────────────────────────────────────────────
    let wakeLock             = null;
    let isPlayerActive       = true;
    let retryCount           = 0;
    const maxRetries         = 3;
    let lastPlaybackPosition = 0;
    let userWantsPlayback    = false;
    let screenWentAway       = false;
    let wasPlayingWhenHidden = false;
    let mediaSessionReady    = false;

    // ─── Shared AudioContext ───────────────────────────────────────────────

        if (window._sharedAudioCtx && window._sharedAudioCtx.state !== 'closed') {
            if (window._sharedAudioCtx.state === 'suspended' ||
                window._sharedAudioCtx.state === 'interrupted') {
                window._sharedAudioCtx.resume().catch(() => {});
            }
            return window._sharedAudioCtx;
        }
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            window._sharedAudioCtx = new AC();

            if (isIOS) {
                window._sharedAudioCtx.onstatechange = () => {
                    const ctx = window._sharedAudioCtx;
                    if (ctx && ctx.state === 'interrupted') {
                        setTimeout(() => {
                            if (window._sharedAudioCtx &&
                                window._sharedAudioCtx.state === 'interrupted') {
                                window._sharedAudioCtx.resume().catch(() => {});
                            }
                        }, 100);
                    }
                };
            }
            return window._sharedAudioCtx;
        } catch (e) {
            console.warn('[Audio] AudioContext creation failed:', e);
            return null;
        }

    // ─── Media Session API ────────────────────────────────────────────────
    function setupMediaSession() {
        if (mediaSessionReady || !('mediaSession' in navigator)) return;
        mediaSessionReady = true;

        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title:  document.getElementById('locationTitle')?.textContent   || 'Minnesota Then',
                artist: document.getElementById('locationCreator')?.textContent || 'Historical Audio',
                album:  'Minnesota Then Tour',
                artwork: [
                    { src: 'https://www.mnthen.com/images/icon-192.png', sizes: '192x192', type: 'image/png' },
                    { src: 'https://www.mnthen.com/images/icon-512.png', sizes: '512x512', type: 'image/png' }
                ]

            navigator.mediaSession.setActionHandler('pause',        () => { if (!audio.paused) togglePlay(); });
            navigator.mediaSession.setActionHandler('seekbackward', (d) => { seek(-(d.seekOffset || 10)); });
            navigator.mediaSession.setActionHandler('seekforward',  (d) => { seek(d.seekOffset || 10);   });

            console.warn('[Audio] Media Session setup failed:', e);

    function updateMediaSessionPosition() {

    let _lastSaveTime = 0;
    function throttledSavePosition(time) {

        }

    // ─── Visibility / Background Handling ─────────────────────────────────
    const visibilityHandler = () => {
        if (document.hidden) {
            if (!isNaN(audio.currentTime) && audio.currentTime > 0) {
                lastPlaybackPosition = audio.currentTime;
                throttledSavePosition(audio.currentTime);
            }

            if (userWantsPlayback) {

                screenWentAway = true;

                     window._sharedAudioCtx.state === 'interrupted')) {

                setTimeout(() => {
                    if (screenWentAway && audio.paused) {
                        showSourcePopup(
                            'Audio Paused',
                            `Press play to resume from ${formatTime(lastPlaybackPosition)}`

                        screenWentAway = false;
                        wasPlayingWhenHidden = false;

    document.addEventListener('visibilitychange', visibilityHandler);

    const blurHandler = () => {
        if (!isNaN(audio.currentTime) && audio.currentTime > 0) {

            announceToScreenReader('Audio playback paused');

    });

    // ─── Core Playback Toggle ─────────────────────────────────────────────
    function togglePlay() {
        if (!isPlayerActive) return;

        const hasValidSrc = audio.src &&
                            audio.src !== window.location.href &&
                            audio.src !== '' &&
                            audio.src !== 'about:blank';
        if (!hasValidSrc) return;

        if (audio.paused) {
            const resumePos = audio.dataset.resumePosition;
            if (resumePos && parseFloat(resumePos) > 0) {
                audio.currentTime = parseFloat(resumePos);
                delete audio.dataset.resumePosition;

            if (playPromise !== undefined) {

                lastPlaybackPosition = audio.currentTime;
            }
        }
    }

    // ─── Error Handling ───────────────────────────────────────────────────
    function handlePlayError(error) {
        console.error('[Audio] Play failed:', error?.name, error?.message);

        releaseWakeLock();
        playPauseBtn.innerHTML = '<i class="bi bi-play" aria-hidden="true"></i>';
        playPauseBtn.setAttribute('aria-label', 'Play');

        if (error?.name === 'NotAllowedError') {

                'Please tap the play button again to start audio playback.'
            );
        } else if (error?.name === 'NotSupportedError') {
            showSourcePopup(
                'Audio Error',
                'This audio format is not supported on your device.'
            );
        } else if (screenWentAway || wasPlayingWhenHidden) {
            const pos = lastPlaybackPosition || 0;
            audio.dataset.resumePosition = pos.toString();
            showSourcePopup(
                'Audio Interrupted',
                `Audio was paused when you left the screen. Press play to resume from ${formatTime(pos)}.`
            );

            wasPlayingWhenHidden = false;
        } else if (retryCount < maxRetries) {
            retryCount++;
            setTimeout(() => attemptRecovery(), 1000 * retryCount);
        } else {
            playPauseBtn.innerHTML = '<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>'; 
            playPauseBtn.setAttribute('aria-label', 'Audio Error');
            showSourcePopup(
                'Audio Error',
                'Unable to play audio after multiple attempts. Please refresh and try again.'
            );
        }

    // ─── Recovery ─────────────────────────────────────────────────────────
    function attemptRecovery() {
        if (!isPlayerActive) return;

        console.log(`[Audio] Recovery attempt ${retryCount}/${maxRetries}`);

        const savedPos  = lastPlaybackPosition || 0;
        const targetSrc = audio.dataset.originalSrc || audio.getAttribute('data-src');

        if (targetSrc && (!audio.src || audio.src === window.location.href)) {

    // ─── Progress UI ──────────────────────────────────────────────────────
    function updateProgress() {

        const percent = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${percent}%`;
        currentTimeSpan.textContent = formatTime(audio.currentTime);

            lastPlaybackPosition = audio.currentTime;
            throttledSavePosition(audio.currentTime);
        }

    function setProgress(e) {
        if (!isPlayerActive || !isFinite(audio.duration)) return;
        const rect = progressContainer.getBoundingClientRect();
        const clientX = e.clientX ?? e.touches?.[0]?.clientX;
        if (clientX === undefined || rect.width <= 0) return;
        audio.currentTime = Math.max(0, Math.min(((clientX - rect.left) / rect.width) * audio.duration, audio.duration)); 
        updateMediaSessionPosition();

    function setDuration() {
        if (!isPlayerActive || !isFinite(audio.duration)) return;
        durationSpan.textContent = formatTime(audio.duration);

    }

    function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // ─── Event Bindings ───────────────────────────────────────────────────
    playPauseBtn.addEventListener('click', togglePlay);

        } else {
            playPauseBtn.innerHTML = '<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>'; 
            playPauseBtn.setAttribute('aria-label', 'Audio Error');
            showSourcePopup(
                'Audio Error',
                'Unable to recover audio. Please refresh and try again.'

        let isScrubbing = false;
        
        const handleScrubStart = (e) => {

            setProgress(e);
        };
        
        const handleScrubMove = (e) => {
            if (!isScrubbing) return;
            setProgress(e);
            e.preventDefault(); // Prevent page scrolling while scrubbing

        }
    };
    window.addEventListener('online', onlineHandler);

    // ─── Initial Load ─────────────────────────────────────────────────────
    audio.load();

    const resetToStart = () => {
        audio.currentTime = 0;
        audio.removeEventListener('loadedmetadata', resetToStart);
    };

    if (audio.readyState >= 1) {
        audio.currentTime = 0;
    } else {
        audio.addEventListener('loadedmetadata', resetToStart);
    }

    // ─── Cleanup ──────────────────────────────────────────────────────────
    return function cleanup() {
        console.log('[Audio] Cleanup starting');
        isPlayerActive = false;
        releaseWakeLock();
    
        document.removeEventListener('visibilitychange', visibilityHandler);
        window.removeEventListener('blur',   blurHandler);
        window.removeEventListener('online', onlineHandler);

            progressContainer.removeEventListener('touchmove', handleScrubMove);
            progressContainer.removeEventListener('touchend', handleScrubEnd);
            progressContainer.removeEventListener('touchcancel', handleScrubEnd);
        }
    
        if (audio && audio.isConnected) {
            audio.pause();
            userWantsPlayback = false;
        }
    
        console.log('[Audio] Cleanup complete');
        };
    }

    }
    if (window.distanceBoxCountdownInterval) {
        clearInterval(window.distanceBoxCountdownInterval);
        window.distanceBoxCountdownInterval = null;
    }

    const userLL = window.userMarker?.getLatLng?.();
    const centerLatLng = userLL ?? (window.lastPosition
        ? { lat: window.lastPosition.lat, lng: window.lastPosition.lng }
        : null);

    if (map && centerLatLng) {
        window.isMapInteracting = false;
        window.followUser = true;
        window._programmaticFlyInProgress = true;
        window._mapAnimating = true;

        map.setView(

    }

    ensureGPSActive();
    closeModalWithAnimation(FADE_DURATION_MS);
}

function closeModalWithAnimation(fadeDuration) {
    const additionalInfoContainer = cachedElements.additionalInfoContainer ||

    const lochuntContainer = cachedElements.lochuntContainer ||
        document.querySelector('.lochunt-container');

    // ── Fade the backdrop overlay out over `fadeDuration`, then hide it ──
    const overlay = document.querySelector('.additional-info-overlay');
    if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.classList.remove('show');
            overlay.style.opacity = '';
        }, fadeDuration);
    }

    if (additionalInfoContainer) {
        additionalInfoContainer.classList.add('fade-out');

        setTimeout(() => {
            if (additionalInfoContainer) {
                additionalInfoContainer.style.display = 'none';
                additionalInfoContainer.classList.remove('fade-out', 'fade-in');
            }

            if (lochuntContainer) {
                lochuntContainer.classList.add('fade-out');

                setTimeout(() => {
                    if (lochuntContainer) {
                        lochuntContainer.style.display = 'none';
                        lochuntContainer.classList.remove('fade-out');
                    }

                    finalizeModalClose();

                }, fadeDuration);
            } else {
                finalizeModalClose();
            }
        }, fadeDuration);
    } else {

            setTimeout(() => {
                if (lochuntContainer) {
                    lochuntContainer.style.display = 'none';
