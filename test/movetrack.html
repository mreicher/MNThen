<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Move Tracker</title>

<script>
/* =====================================================================
   CLOUD SETUP (optional, do it whenever you're ready)
   Leave as null: the app runs on this computer only, no sign-in.
   To turn on email/password sign-in and sync, replace null with the

   window.FIREBASE_CONFIG = {
     apiKey: "...",

     projectId: "your-project",
     appId: "..."
   };
   ===================================================================== */
window.FIREBASE_CONFIG = null;
</script>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  .btn { border-radius: .375rem; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; padding: .3rem .7rem; font-size: .8125rem; font-weight: 600; line-height: 1.25rem; white-space: nowrap; }
  .btn:hover { background: #f1f5f9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-danger { background: #dc2626; border-color: #dc2626; color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: .05rem .4rem; font-size: .6875rem; }
  .btn-dark { background: #1e293b; border-color: #475569; color: #fff; }
  .btn-dark:hover { background: #334155; }
  .field { width: 100%; min-width: 0; border-radius: .375rem; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; padding: .3rem .5rem; font-size: .875rem; font-weight: 400; }
  .field:focus, .btn:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }
  .tab { white-space: nowrap; border-radius: .375rem; padding: .3rem .7rem; font-size: .8125rem; font-weight: 600; color: #cbd5e1; }
  .tab[aria-selected="true"] { background: #fff; color: #0f172a; }
  .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgb(15 23 42 / .6); }
  .modal.hidden, .view.hidden, .screen.hidden { display: none; }
  .dialog { width: 100%; max-width: 28rem; max-height: 100%; overflow-y: auto; border-radius: .5rem; background: #fff; padding: 1.25rem; box-shadow: 0 20px 40px rgb(0 0 0 / .25); }
  .screen { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 1rem; background: #0f172a; overflow-y: auto; }
  #board { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
  #dispatchGrid { grid-template-rows: minmax(0, 1fr); }
  .scroll-thin { scrollbar-width: thin; }
  .drag-over { outline: 2px dashed #2563eb; outline-offset: -2px; background: #dbeafe !important; }
  .dragging { opacity: .45; }
  .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .report-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; margin-bottom: .75rem; }
  .report-table th, .report-table td { border: 1px solid #94a3b8; padding: 4px 6px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .report-table th { background: #f1f5f9; font-weight: 600; }
  .report-table .day-row td { background: #e2e8f0; font-weight: 700; }
  .box { display: inline-block; width: 14px; height: 14px; border: 1.5px solid #000; }
  .note-line { border-bottom: 1px solid #94a3b8; height: 28px; }
  .sheet-page + .sheet-page { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 3px dashed #94a3b8; }

  @media (max-width: 1023px) {
    #board { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: max-content; overflow-y: auto; }
    #weekGrid { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; grid-auto-rows: max-content; }
    #dispatchGrid { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none; grid-auto-rows: max-content; overflow-y: auto; }
  }

  @media print {
    @page { size: letter portrait; margin: 0.5in; }
    html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
    #app, .modal:not(#sheetModal), .screen, #toast, .no-print, button { display: none !important; }
    #sheetModal { display: block !important; position: static !important; padding: 0 !important; background: #fff !important; }
    #sheetPanel { display: block !important; max-width: none !important; max-height: none !important; width: 100% !important; overflow: visible !important; box-shadow: none !important; border-radius: 0 !important; }
    #sheetBody { overflow: visible !important; padding: 0 !important; }
    #sheetModal * { color: #000 !important; background: transparent !important; box-shadow: none !important; }
    .report-table { font-size: 10pt; }
    .report-table th, .report-table td { border: 1px solid #000 !important; }
    .report-table thead { display: table-header-group; }
    .report-table tr { break-inside: avoid; page-break-inside: avoid; }
    .report-heading { break-after: avoid; page-break-after: avoid; }
    .sheet-page + .sheet-page { break-before: page; page-break-before: always; margin: 0; padding: 0; border: 0; }
  }
</style>
</head>
<body class="h-screen overflow-hidden bg-slate-100 text-slate-800 antialiased">

<div id="app" class="h-screen overflow-hidden flex flex-col">
  <header class="shrink-0 bg-slate-900 text-white px-3 py-2 flex flex-wrap items-center justify-between gap-x-3 gap-y-1">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 min-w-0">
      <div class="min-w-0">
        <h1 id="appTitle" class="text-base font-bold leading-tight truncate">Office Move Tracker</h1>
        <button id="syncStatus" type="button" data-act="view" data-view="settings" class="block text-[11px] text-slate-300 hover:underline"></button>
      </div>
      <nav class="flex gap-1" role="tablist" aria-label="Views">
        <button type="button" role="tab" class="tab" data-act="view" data-view="board">Board</button>
        <button type="button" role="tab" class="tab" data-act="view" data-view="calendar">Calendar</button>
        <button type="button" role="tab" class="tab" data-act="view" data-view="dispatch">Team Lists</button>
        <button type="button" role="tab" class="tab" data-act="view" data-view="settings">Settings</button>
      </nav>
    </div>
    <div id="stats" class="hidden xl:flex items-center gap-1.5 text-xs whitespace-nowrap"></div>
    <div class="flex flex-wrap items-center gap-1.5">
      <input id="searchInput" type="search" placeholder="Search office or person" aria-label="Search office or person"
             class="w-52 rounded-md bg-slate-800 border border-slate-600 px-2 py-1 text-sm placeholder-slate-400">
      <button id="undoBtn" type="button" class="btn btn-dark" data-act="undo" disabled>Undo</button>
      <button type="button" class="btn btn-dark" data-act="office-new">+ Office</button>
      <button type="button" class="btn btn-primary" data-act="move-new">+ Move</button>
      <button type="button" class="btn" data-act="report">Print Daily Report</button>
    </div>
  </header>

  <div id="banner" class="hidden shrink-0 bg-amber-200 text-amber-950 text-sm px-3 py-1 flex items-center justify-between gap-3" role="alert">
    <span id="bannerText"></span><button id="bannerBtn" type="button" class="btn btn-sm hidden" data-act="upload-local"></button>
  </div>

  <main class="flex-1 min-h-0">
    <section id="view-board" class="view h-full"><div id="board" class="h-full gap-1.5 p-1.5"></div></section>

    <section id="view-calendar" class="view hidden h-full flex flex-col">
      <div class="shrink-0 flex flex-wrap items-center gap-2 px-2 pt-2">
        <button type="button" class="btn" data-act="cal-step" data-step="-1" aria-label="Previous">&lsaquo;</button>
        <button type="button" class="btn" data-act="cal-today">Today</button>
        <button type="button" class="btn" data-act="cal-step" data-step="1" aria-label="Next">&rsaquo;</button>
        <h2 id="calTitle" class="text-lg font-bold mr-auto"></h2>
        <select id="calTeam" class="field !w-40" data-change="cal-team" aria-label="Filter by team"></select>
        <button type="button" class="btn" data-act="cal-mode" data-mode="week">Week</button>
        <button type="button" class="btn" data-act="cal-mode" data-mode="month">Month</button>
      </div>
      <div id="calBody" class="flex-1 min-h-0 p-2 overflow-y-auto"></div>
    </section>

    <section id="view-dispatch" class="view hidden h-full flex flex-col">
      <div class="shrink-0 flex flex-wrap items-center gap-2 px-2 pt-2">
        <label class="text-sm font-semibold flex items-center gap-1">From <input id="dFrom" type="date" class="field !w-36" data-change="d-from"></label>
        <label class="text-sm font-semibold flex items-center gap-1">To <input id="dTo" type="date" class="field !w-36" data-change="d-to"></label>
        <button type="button" class="btn" data-act="d-quick" data-quick="today">Today</button>
        <button type="button" class="btn" data-act="d-quick" data-quick="next">Next move day</button>
        <button type="button" class="btn mr-auto" data-act="d-quick" data-quick="week">7 days</button>
        <button type="button" class="btn" data-act="split">Split unassigned evenly</button>
        <button type="button" class="btn" data-act="reshuffle">Reshuffle all</button>
        <button type="button" class="btn btn-primary" data-act="print-packet">Print packet</button>
        <button type="button" class="btn" data-act="print-master">Master sheet</button>
        <button type="button" class="btn" data-act="compose" data-team="master">Send master</button>
      </div>
      <p id="dSummary" class="shrink-0 px-2 pt-1 text-sm"></p>
      <div id="dispatchGrid" class="flex-1 min-h-0 grid gap-1.5 p-2"></div>
    </section>

    <section id="view-settings" class="view hidden h-full overflow-y-auto p-3"></section>
  </main>
</div>

<!-- Office form -->
<div id="officeModal" class="modal hidden">
  <form id="officeForm" class="dialog space-y-3" role="dialog" aria-modal="true" aria-labelledby="officeTitle" autocomplete="off">
    <h2 id="officeTitle" class="text-lg font-bold">Add Office</h2>
    <label class="block text-sm font-medium">Office number / name<input id="oName" class="field mt-1" required maxlength="60"></label>
    <div class="grid grid-cols-2 gap-2">
      <label class="block text-sm font-medium">Current occupant<input id="oOccupant" class="field mt-1" maxlength="80" placeholder="Blank if vacant"></label>
      <label class="block text-sm font-medium">Incoming member<input id="oIncoming" class="field mt-1" maxlength="80" placeholder="Optional"></label>
    </div>
    <label class="block text-sm font-medium">Stage<select id="oStage" class="field mt-1"></select></label>
    <label class="flex items-center gap-2 text-sm"><input id="oCleared" type="checkbox"> Cleared: previous occupant is out</label>
    <label class="block text-sm font-medium">Notes<textarea id="oNotes" class="field mt-1" rows="3" maxlength="500"></textarea></label>
    <p id="officeError" class="hidden text-sm text-red-700" role="alert"></p>
    <div class="flex justify-end gap-2"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save office</button></div>
  </form>
</div>

<!-- Move form -->
<div id="moveModal" class="modal hidden">
  <form id="moveForm" class="dialog space-y-3 !max-w-lg" role="dialog" aria-modal="true" aria-labelledby="moveTitle" autocomplete="off">
    <h2 id="moveTitle" class="text-lg font-bold">Schedule Move</h2>
    <label class="block text-sm font-medium">Who is moving<input id="mPerson" class="field mt-1" required maxlength="80" list="peopleList"><datalist id="peopleList"></datalist></label>
    <div class="grid grid-cols-2 gap-2">
      <label class="block text-sm font-medium">From office<select id="mFrom" class="field mt-1"></select></label>
      <label class="block text-sm font-medium">To office<select id="mTo" class="field mt-1"></select></label>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <label class="block text-sm font-medium">Date<input id="mDate" type="date" class="field mt-1" required min="2000-01-01" max="2099-12-31"></label>
      <label class="block text-sm font-medium">Start time<input id="mTime" type="time" class="field mt-1"></label>
      <label class="block text-sm font-medium">Minutes<input id="mDuration" type="number" class="field mt-1" min="15" max="720" step="15" required></label>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <label class="block text-sm font-medium">Team<select id="mTeam" class="field mt-1"></select></label>
      <label class="block text-sm font-medium">Status<select id="mStatus" class="field mt-1"><option value="tentative">Tentative</option><option value="confirmed">Confirmed</option><option value="done">Done</option></select></label>
    </div>
    <label class="block text-sm font-medium">Notes for the crew<textarea id="mNotes" class="field mt-1" rows="2" maxlength="300"></textarea></label>
    <div id="mIssues" class="text-sm space-y-0.5" aria-live="polite"></div>
    <p id="moveError" class="hidden text-sm text-red-700 font-semibold" role="alert"></p>
    <div class="flex gap-2"><button id="mDelete" type="button" class="btn text-red-700 mr-auto" data-act="move-delete">Delete move</button><button type="button" class="btn ml-auto" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save move</button></div>
  </form>
</div>

<!-- Send a list -->
<div id="composeModal" class="modal hidden">
  <div class="dialog !max-w-lg space-y-2" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
    <h2 id="composeTitle" class="text-lg font-bold"></h2>
    <p id="composeTo" class="text-sm text-slate-600 break-words"></p>
    <textarea id="composeText" class="field font-mono !text-xs" rows="14" aria-label="Message"></textarea>
    <p id="composeCount" class="text-xs text-slate-500"></p>
    <div class="flex flex-wrap gap-2">
      <button id="cText" type="button" class="btn btn-primary" data-act="send-text">Open text message</button>
      <button id="cEmail" type="button" class="btn btn-primary" data-act="send-email">Open email</button>
      <button type="button" class="btn" data-act="send-copy">Copy</button>
      <button type="button" class="btn" data-act="send-ics">Calendar file</button>
      <button id="cMark" type="button" class="btn" data-act="send-mark">Mark as sent</button>
      <button type="button" class="btn ml-auto" data-act="close">Close</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal hidden" style="z-index:50">
  <div class="dialog !max-w-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h2 id="confirmTitle" class="text-lg font-bold"></h2>
    <p id="confirmText" class="mt-2 text-sm text-slate-600 break-words"></p>
    <div class="mt-4 flex justify-end gap-2"><button id="confirmNo" type="button" class="btn" data-act="confirm-no">Cancel</button><button id="confirmYes" type="button" class="btn btn-danger" data-act="confirm-yes"></button></div>
  </div>
</div>

<!-- Printable sheets: daily report, master sheet, team lists -->
<div id="sheetModal" class="modal hidden" style="z-index:30">
  <div id="sheetPanel" class="w-full max-w-4xl max-h-full flex flex-col rounded-lg bg-white shadow-xl overflow-hidden" role="dialog" aria-modal="true" aria-label="Print preview">
    <div class="no-print shrink-0 flex items-center justify-between border-b border-slate-200 px-5 py-3">
      <span class="font-semibold">Print preview</span>
      <div class="flex gap-2"><button id="printBtn" type="button" class="btn btn-primary" data-act="print">Print</button><button type="button" class="btn" data-act="close">Close</button></div>
    </div>
    <div id="sheetBody" class="flex-1 min-h-0 overflow-y-auto px-5 py-4"></div>
  </div>
</div>

<div id="loginScreen" class="screen hidden">
  <form id="loginForm" class="dialog !max-w-sm space-y-3">
    <h2 class="text-xl font-bold">Office Move Tracker</h2>
    <p class="text-sm text-slate-600">Sign in to continue.</p>
    <label class="block text-sm font-medium">Email<input id="lEmail" type="email" class="field mt-1" required autocomplete="username"></label>
    <label class="block text-sm font-medium">Password<input id="lPassword" type="password" class="field mt-1" required autocomplete="current-password"></label>
    <p id="loginError" class="text-sm text-red-700" role="alert"></p>
    <button id="loginBtn" type="submit" class="btn btn-primary w-full">Sign in</button>
    <button type="button" class="text-sm text-blue-700 hover:underline" data-act="reset-password">Forgot password?</button>
  </form>
</div>

<div id="waitScreen" class="screen hidden"><div class="dialog !max-w-xl space-y-3" id="waitBody"></div></div>

<div id="toast" class="pointer-events-none fixed bottom-3 left-1/2 -translate-x-1/2 z-50 hidden max-w-[90vw] rounded-md bg-slate-900 text-white text-sm px-4 py-2 shadow-lg" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= Constants ================= */
const KEY = 'officeMoveTracker.v2';
const OLD_KEY = 'officeMoveTracker.v1';
const COLLECTIONS = ['offices', 'moves', 'meta', 'sent'];

const STAGES = [
  { id: 'not_moving',    label: 'Not Moving',           bar: 'border-slate-500',   badge: 'bg-slate-200 text-slate-800' },
  { id: 'ready_paint',   label: 'Ready for painting',   bar: 'border-orange-500',  badge: 'bg-orange-100 text-orange-900' },
  { id: 'prepped_paint', label: 'Prepped for painting', bar: 'border-amber-500',   badge: 'bg-amber-100 text-amber-900' },
  { id: 'painted',       label: 'Painted',              bar: 'border-violet-500',  badge: 'bg-violet-100 text-violet-900' },
  { id: 'cleaned',       label: 'Cleaned',              bar: 'border-cyan-500',    badge: 'bg-cyan-100 text-cyan-900' },
  { id: 'ready_movein',  label: 'Ready for move in',    bar: 'border-blue-600',    badge: 'bg-blue-100 text-blue-900' },
  { id: 'moved_in',      label: 'Moved in',             bar: 'border-emerald-600', badge: 'bg-emerald-100 text-emerald-900' }
];
const STAGE_IDS = STAGES.map(s => s.id);
const stageOf = id => STAGES[STAGE_IDS.indexOf(id)];

const TEAM_COLORS = [
  'bg-blue-100 border-blue-600', 'bg-emerald-100 border-emerald-600', 'bg-fuchsia-100 border-fuchsia-600', 'bg-orange-100 border-orange-600',
  'bg-cyan-100 border-cyan-600', 'bg-rose-100 border-rose-600', 'bg-lime-100 border-lime-600', 'bg-violet-100 border-violet-600'
];
const NO_TEAM_COLOR = 'bg-white border-slate-400';

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = prefix => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const str = (v, max = 500) => (typeof v === 'string' ? v.slice(0, max) : '');
const isId = v => typeof v === 'string' && /^[\w-]{1,120}$/.test(v);
const isDate = v => typeof v === 'string' && /^(19|20)\d{2}-\d{2}-\d{2}$/.test(v);
const isTime = v => typeof v === 'string' && /^([01]\d|2[0-3]):[0-5]\d/.test(v);
const clampInt = (v, min, max, fallback) => { const n = Math.round(Number(v)); return Number.isFinite(n) && v !== '' && v !== null ? Math.min(max, Math.max(min, n)) : fallback; };
const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (key, n) => { const d = parseDate(key); d.setDate(d.getDate() + n); return dateKey(d); };
const todayKey = () => dateKey(new Date());
const fmtDate = (key, opts = { weekday: 'short', month: 'short', day: 'numeric' }) => {
  const o = { ...opts };
  if (parseDate(key).getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return parseDate(key).toLocaleDateString('en-US', o);
};
const longDate = key => fmtDate(key, { weekday: 'long', month: 'long', day: 'numeric' });
const minutesOf = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const clock = mins => { const h = Math.floor(mins / 60) % 24; return `${h % 12 || 12}:${pad(mins % 60)} ${h < 12 ? 'AM' : 'PM'}`; };
const fmtTime = t => (t ? clock(minutesOf(t)) : 'Time TBD');
const fmtSpan = m => (m.time ? `${clock(minutesOf(m.time))} - ${clock(minutesOf(m.time) + m.duration)}` : 'Time TBD');
const rangeLabel = (a, b) => (a === b ? longDate(a) : `${fmtDate(a)} to ${fmtDate(b)}`);

/* ================= Data shapes ================= */
function normalizeOffice(o) {
  return {
    id: isId(o.id) ? o.id : newId('o'),
    name: str(o.name, 60) || 'Unnamed office',
    occupant: str(o.occupant, 80),
    incoming: str(o.incoming, 80),
    stage: STAGE_IDS.includes(o.stage) ? o.stage : STAGE_IDS[0],
    cleared: o.cleared === true,
    notes: str(o.notes)
  };
}
function normalizeMove(m) {
  return {
    id: isId(m.id) ? m.id : newId('m'),
    person: str(m.person, 80) || 'Unnamed',
    fromId: isId(m.fromId) ? m.fromId : '',
    toId: isId(m.toId) ? m.toId : '',
    date: isDate(m.date) ? m.date : '',
    time: isTime(m.time) ? m.time.slice(0, 5) : '',
    duration: clampInt(m.duration, 15, 720, 60),
    teamId: isId(m.teamId) ? m.teamId : '',
    status: ['tentative', 'confirmed', 'done'].includes(m.status) ? m.status : 'tentative',
    notes: str(m.notes, 300)
  };
}
function normalizeSettings(s = {}) {
  const teams = Array.isArray(s.teams) ? s.teams : [1, 2, 3].map(n => ({ id: 't' + n, name: 'Team ' + n, color: n - 1 }));
  return {
    id: 'settings',
    title: str(s.title, 60) || 'Office Move Tracker',
    capacity: clampInt(s.capacity, 1, 50, 3),
    duration: clampInt(s.duration, 15, 720, 60),
    includeNotes: s.includeNotes !== false,
    teams: teams.filter(t => t && isId(t.id)).map((t, i) => ({
      id: t.id, name: str(t.name, 40) || `Team ${i + 1}`, lead: str(t.lead, 80), phone: str(t.phone, 30), email: str(t.email, 120),
      color: clampInt(t.color, 0, TEAM_COLORS.length - 1, i % TEAM_COLORS.length)
    }))
  };
}
function normalizeSent(r) {
  return { id: r.id, teamId: str(r.teamId, 120), moveId: str(r.moveId, 120), sig: str(r.sig, 2000), date: isDate(r.date) ? r.date : '', at: str(r.at, 40) };
}
const NORMALIZERS = { offices: normalizeOffice, moves: normalizeMove, meta: normalizeSettings, sent: normalizeSent };
const emptyState = () => ({ offices: {}, moves: {}, meta: {}, sent: {} });

/* Accepts saved or imported data and returns a clean state object. */
function cleanState(data) {
  const out = emptyState();
  for (const coll of COLLECTIONS) {
    const items = data && data[coll] && typeof data[coll] === 'object' ? Object.values(data[coll]) : [];
    for (const item of items) {
      if (!item || typeof item !== 'object') continue;
      if (coll === 'sent' && !isId(item.id)) continue;
      const clean = NORMALIZERS[coll](item);
      out[coll][clean.id] = clean;
    }
  }
  return out;
}

/* Brings version 1 data (one occupant and one move date per room) into the new shape. */
function migrateV1(data) {
  const out = emptyState();
  for (const r of (data.rooms || [])) {
    if (!r || typeof r !== 'object') continue;
    const office = normalizeOffice({ ...r, cleared: !r.occupant });
    out.offices[office.id] = office;
    if (isDate(r.moveDate)) {
      const done = office.stage === 'moved_in';
      const move = normalizeMove({ id: 'm' + office.id, person: office.occupant || office.name, [done ? 'toId' : 'fromId']: office.id,
        date: r.moveDate, time: r.moveTime, status: done ? 'done' : 'tentative' });
      out.moves[move.id] = move;
    }
  }
  return out;
}

/* ================= State and persistence ================= */
let state = emptyState();
let cloud = null;                 // set when Firebase sync is active
const undoStack = [];

const settings = () => state.meta.settings || normalizeSettings();
const offices = () => Object.values(state.offices).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
const moves = () => Object.values(state.moves);
const officeName = id => (state.offices[id] ? state.offices[id].name : '');
const teamOf = id => settings().teams.find(t => t.id === id);
const teamName = id => (teamOf(id) ? teamOf(id).name : 'Unassigned');
const teamClass = id => (teamOf(id) ? TEAM_COLORS[teamOf(id).color] : NO_TEAM_COLOR);
const teamIdOf = m => (teamOf(m.teamId) ? m.teamId : '');
const byWhen = (a, b) => a.date.localeCompare(b.date) || (a.time || '99:99').localeCompare(b.time || '99:99') || a.person.localeCompare(b.person);
const movesBetween = (from, to) => moves().filter(m => m.date >= from && m.date <= to).sort(byWhen);
const routeText = (m, arrow = '->') => {
  const a = officeName(m.fromId), b = officeName(m.toId);
  return a && b ? `${a} ${arrow} ${b}` : b ? `Into ${b}` : a ? `Out of ${a}` : 'Office not set';
};

let bannerLock = false;
function showBanner(text, buttonLabel = '') {
  $('banner').classList.toggle('hidden', !text);
  $('bannerText').textContent = text;
  $('bannerBtn').classList.toggle('hidden', !buttonLabel);
  $('bannerBtn').textContent = buttonLabel;
}

function readLocal() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    if (raw !== null) return cleanState(JSON.parse(raw));
    const old = localStorage.getItem(OLD_KEY);
    if (old !== null) { raw = old; return migrateV1(JSON.parse(old)); }
  } catch (err) {
    console.warn('Could not read saved data', err);
    if (raw !== null) {
      try { localStorage.setItem(KEY + '.corrupt', raw); } catch (_) {}
      showBanner('Saved data could not be read. A backup copy was kept in this browser and the app started empty.');
    } else {
      showBanner('This browser is blocking local storage. Changes will be lost when the page closes.');
    }
    bannerLock = true;
  }
  return emptyState();
}

function writeLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    if (!bannerLock) showBanner('');
  } catch (err) {
    showBanner('Your latest change could NOT be saved. Check browser storage settings or free space.');
  }
}

function applyChanges(changes) {
  for (const { coll, id, val } of changes) {
    if (val === null) delete state[coll][id];
    else state[coll][id] = val;
  }
  if (cloud) cloud.write(changes); else writeLocal();
}

/* Every edit goes through here, so it is saved immediately and can be undone. */
function transact(label, build) {
  const changes = new Map();
  build((coll, id, val) => changes.set(`${coll}/${id}`, { coll, id, val }));
  const real = [...changes.values()].filter(c => JSON.stringify(state[c.coll][c.id] ?? null) !== JSON.stringify(c.val));
  if (!real.length) return false;
  const inverse = real.map(c => ({ coll: c.coll, id: c.id, val: state[c.coll][c.id] ?? null }));
  undoStack.push({ label, inverse });
  if (undoStack.length > 50) undoStack.shift();
  applyChanges(real);
  render();
  return true;
}
function undo() {
  const last = undoStack.pop();
  if (!last) return;
  applyChanges(last.inverse);
  render(true);
  toast(`Undid: ${last.label}`);
}
const saveSettings = (label, patch) => transact(label, set => set('meta', 'settings', normalizeSettings({ ...settings(), ...patch })));

/* ================= Readiness and conflicts ================= */
const span = m => (m.time ? [minutesOf(m.time), minutesOf(m.time) + m.duration] : null);
const overlaps = (a, b) => { const x = span(a), y = span(b); return !!(x && y && a.date === b.date && x[0] < y[1] && y[0] < x[1]); };

/* Returns problems for a move. kind "ready" blocks confirmation; kind "conflict" is a warning. */
function issuesFor(m, all = moves()) {
  if (m.status === 'done') return [];
  const out = [];
  const ready = text => out.push({ kind: 'ready', text });
  const conflict = text => out.push({ kind: 'conflict', text });
  const others = all.filter(o => o.id !== m.id && o.status !== 'done');
  const dest = state.offices[m.toId];
  if (dest && !(dest.stage === 'moved_in' && same(dest.occupant, m.person))) {
    if (dest.stage !== 'ready_movein') ready(`${dest.name} is not ready (${stageOf(dest.stage).label})`);
    if (!dest.cleared) ready(dest.occupant ? `${dest.name}: ${dest.occupant} is not confirmed out` : `${dest.name} is not marked cleared`);
    const when = x => x.date + (x.time || '00:00');
    others.filter(o => o.fromId === m.toId && when(o) >= when(m))
      .forEach(o => ready(`${o.person} is not scheduled out of ${dest.name} until ${fmtDate(o.date)} ${fmtTime(o.time)}`));
  }
  if (m.date && m.date < todayKey()) conflict('Past due and not marked done');
  if (m.toId && others.some(o => o.toId === m.toId)) conflict(`Another move is also going into ${officeName(m.toId)}`);
  const clash = others.filter(o => overlaps(m, o));
  if (teamOf(m.teamId)) clash.filter(o => o.teamId === m.teamId).forEach(o => conflict(`${teamName(m.teamId)} is double-booked (${o.person}, ${fmtTime(o.time)})`));
  if (clash.some(o => same(o.person, m.person))) conflict(`${m.person} has two moves at the same time`);
  if (span(m)) {
    const points = [span(m)[0], ...clash.map(o => span(o)[0]).filter(s => s > span(m)[0])];
    const peak = Math.max(...points.map(p => 1 + clash.filter(o => span(o)[0] <= p && p < span(o)[1]).length));
    if (peak > settings().capacity) conflict(`${peak} moves at once (limit ${settings().capacity})`);
  }
  return out;
}
const isAtRisk = (m, all) => m.status !== 'done' && (m.status === 'confirmed' || m.date <= addDays(todayKey(), 3)) && issuesFor(m, all).some(i => i.kind === 'ready');

/* Saves a move; marking it done also updates both offices. */
function putMove(set, move) {
  const previous = state.moves[move.id];
  set('moves', move.id, move);
  if (move.status !== 'done' || (previous && previous.status === 'done')) return;
  const from = state.offices[move.fromId];
  if (from && (!from.occupant || same(from.occupant, move.person))) {
    const stage = ['moved_in', 'not_moving'].includes(from.stage) ? 'ready_paint' : from.stage;
    set('offices', from.id, { ...from, occupant: '', cleared: true, stage });
  }
  const to = state.offices[move.toId];
  if (to) set('offices', to.id, { ...to, occupant: move.person, incoming: same(to.incoming, move.person) ? '' : to.incoming, cleared: false, stage: 'moved_in' });
}

function setStatus(id, status) {
  const m = state.moves[id];
  if (!m || m.status === status) return;
  const next = { ...m, status };
  const blockers = status === 'confirmed' ? issuesFor(next).filter(i => i.kind === 'ready') : [];
  if (blockers.length) { toast(`Can't confirm yet: ${blockers[0].text}`); render(true); return; }
  transact(`${m.person} marked ${status}`, set => putMove(set, next));
  toast(status === 'done' ? `${m.person} done. Offices updated.` : `${m.person} marked ${status}`);
}

/* Spreads moves across teams, day by day, never double-booking a timed team. */
function splitMoves(from, to, reshuffle) {
  const teams = settings().teams;
  if (!teams.length) return toast('Add a team in Settings first.');
  const open = movesBetween(from, to).filter(m => m.status !== 'done' && (reshuffle || !teamOf(m.teamId)));
  if (!open.length) return toast('No moves need a team in this date range.');
  const openIds = new Set(open.map(m => m.id));
  const placed = movesBetween(from, to).filter(m => !openIds.has(m.id) && teamOf(m.teamId));
  const result = open.map(m => {
    const load = t => {
      const mine = placed.filter(p => p.teamId === t.id);
      const day = mine.filter(p => p.date === m.date);
      return [day.length, day.reduce((n, p) => n + p.duration, 0), mine.length];
    };
    const free = teams.filter(t => !placed.some(p => p.teamId === t.id && overlaps(p, m)));
    free.sort((a, b) => { const x = load(a), y = load(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; });
    const next = { ...m, teamId: free.length ? free[0].id : '' };
    if (free.length) placed.push(next);
    return next;
  });
  transact('team split', set => result.forEach(m => set('moves', m.id, m)));
  const skipped = result.filter(m => !m.teamId).length;
  toast(skipped ? `${plural(skipped, 'move')} left unassigned: every team is busy at that time.` : `Assigned ${plural(result.length, 'move')}.`);
}

let dragged = null;
const clearDrag = () => document.querySelectorAll('.drag-over, .dragging').forEach(el => el.classList.remove('drag-over', 'dragging'));
const accepts = zone => dragged && (dragged.type === 'office') === (zone.dataset.drop === 'stage');
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-drag]');

  const card = el.closest('.card') || el;

document.addEventListener('dragover', e => {

  if (!zone || !accepts(zone)) return;
  e.preventDefault();

document.addEventListener('drop', e => {

let dFrom = todayKey(), dTo = todayKey();

/* A fingerprint of what a team lead was told, used to detect later changes. */
const signature = m => JSON.stringify([m.date, m.time, m.duration, m.person, officeName(m.fromId), officeName(m.toId), m.status === 'tentative', settings().includeNotes ? m.notes : '']);
function sendState(teamId) {
  const mine = teamMoves(teamId);
  const records = Object.values(state.sent).filter(r => r.teamId === teamId);
  const find = m => records.find(r => r.moveId === m.id);
  const removed = records.filter(r => r.date >= dFrom && r.date <= dTo && !mine.some(m => m.id === r.moveId));
  const fresh = mine.filter(m => m.status !== 'done' && !find(m));
  const changed = mine.filter(m => m.status !== 'done' && find(m) && find(m).sig !== signature(m));
  const used = records.filter(r => removed.includes(r) || mine.some(m => m.id === r.moveId));
  const last = used.map(r => r.at).sort().pop();
  return { mine, removed, fresh, changed, last };
}
function sendLabel(teamId) {
  const s = sendState(teamId);
  if (!s.last) return s.mine.length ? ['Not sent yet', 'text-slate-500'] : ['', ''];
  const parts = [];
  if (s.fresh.length) parts.push(`${s.fresh.length} new`);
  if (s.changed.length) parts.push(`${s.changed.length} changed`);
  if (s.removed.length) parts.push(`${s.removed.length} removed`);
  if (parts.length) return [`Resend: ${parts.join(', ')}`, 'text-red-700 font-bold'];
  return [`Sent ${new Date(s.last).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}, up to date`, 'text-emerald-700 font-semibold'];
}

let composing = 'master';
function moveText(m, number, all, withTeam) {
  const lines = [`${number}. ${fmtSpan(m)} - ${m.person}${withTeam ? ` [${teamName(teamIdOf(m))}]` : ''}`, `   ${routeText(m)}`];
  if (m.status === 'done') lines.push('   DONE');
  if (m.status === 'tentative') lines.push('   TENTATIVE');
  if (issuesFor(m, all).some(i => i.kind === 'ready')) lines.push(`   HOLD: ${officeName(m.toId)} not ready yet`);
  if (settings().includeNotes && m.notes) lines.push(`   Note: ${m.notes.replace(/\s+/g, ' ')}`);
  return lines.join('\n');
}
function messageFor(target) {
  const master = target === 'master', all = moves();
  const list = master ? movesBetween(dFrom, dTo) : teamMoves(target);
  const team = teamOf(target);
  const out = [];
  if (!master && sendState(target).last) out.push('UPDATED LIST - replaces the earlier one');
  out.push(`${settings().title}: ${master ? 'ALL MOVES' : team.name}`, rangeLabel(dFrom, dTo));
  if (!master && team.lead) out.push(`Lead: ${team.lead}`);
  let day = '', number = 0;
  for (const m of list) {
    if (m.date !== day) { day = m.date; number = 0; out.push('', longDate(day).toUpperCase()); }
    out.push(moveText(m, ++number, all, master));
  }
  out.push('', list.length ? `${plural(list.length, 'move')} total.` : 'No moves for this period.');
  return out.join('\n');
}

const recipients = target => {
  const teams = target === 'master' ? settings().teams : [teamOf(target)];

function openLink(url) {

async function copyText(text, okMessage = 'Copied.') {

    area.value = text;
    (openModal || document.body).appendChild(area);
    area.select();

function sendText() {

async function sendEmail() {

  const subject = `${settings().title}: ${composing === 'master' ? 'All moves' : teamName(composing)}, ${rangeLabel(dFrom, dTo)}`;

function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'moves';
function downloadCalendar(target) {
  const list = (target === 'master' ? movesBetween(dFrom, dTo) : teamMoves(target)).filter(m => m.status !== 'done');
  if (!list.length) return toast('No open moves to export.');
  const safe = s => String(s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, '');
  const local = (date, mins) => { const d = parseDate(date); d.setMinutes(mins); return `${dateKey(d).replace(/-/g, '')}T${pad(d.getHours())}${pad(d.getMinutes())}00`; };
  const fold = line => line.match(/.{1,70}/gu).join('\r\n ');
  const events = list.flatMap(m => [
    'BEGIN:VEVENT', `UID:${m.id}@office-move-tracker`, `DTSTAMP:${stamp}`,
    ...(m.time ? [`DTSTART:${local(m.date, minutesOf(m.time))}`, `DTEND:${local(m.date, minutesOf(m.time) + m.duration)}`]
      : [`DTSTART;VALUE=DATE:${m.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(m.date, 1).replace(/-/g, '')}`]),
    `SUMMARY:${safe(`Move: ${m.person} (${routeText(m)}) - ${teamName(teamIdOf(m))}${m.status === 'tentative' ? ' TENTATIVE' : ''}`)}`,
    `DESCRIPTION:${safe(m.notes)}`, 'END:VEVENT'
  ]);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Office Move Tracker//EN', ...events, 'END:VCALENDAR'].map(fold).join('\r\n') + '\r\n';
  download(`${slug(target === 'master' ? 'all-moves' : teamName(target))}-${dFrom}.ics`, ics, 'text/calendar');
}

const byDay = (list, build) => [...new Set(list.map(m => m.date))].map(day => build(list.filter(m => m.date === day), longDate(day) + (day === todayKey() ? ' (Today)' : ''))).join('');

function masterPage() {

function reportPage() {
  const all = moves(), today = todayKey(), list = offices();
  const selected = STAGES.filter(s => reportStages.has(s.id));
  const matches = list.filter(o => reportStages.has(o.stage)).sort((a, b) => STAGE_IDS.indexOf(a.stage) - STAGE_IDS.indexOf(b.stage));
  const preset = PRESETS.find(p => p.stages.length === reportStages.size && p.stages.every(s => reportStages.has(s)));
  const filterName = preset ? preset.label : selected.map(s => s.label).join(', ') || 'No stages selected';
  const nextFor = o => {
    const m = all.filter(x => x.status !== 'done' && (x.toId === o.id || x.fromId === o.id)).sort(byWhen)[0];
    return m ? `${m.toId === o.id ? 'In' : 'Out'}: ${esc(m.person)}<br>${fmtDate(m.date)} ${fmtTime(m.time)}` : 'Not scheduled';
  };
  const ranges = [['all', 'All upcoming moves'], ['today', 'Today only'], ['week', 'Next 7 days (including today)']];
  const end = reportRange === 'today' ? today : reportRange === 'week' ? addDays(today, 6) : '9999-12-31';
  const upcoming = all.filter(m => m.date >= today && m.date <= end).sort(byWhen);
  const overdue = all.filter(m => m.status !== 'done' && m.date < today).sort(byWhen);
  const schedule = items => byDay(items, (day, caption) => table(['Time', 'Team', 'Who', 'Move', 'Status', 'Notes'], [14, 12, 19, 18, 21, 16],
    day.map(m => row([fmtTime(m.time), esc(teamName(teamIdOf(m))), `<b>${esc(m.person)}</b>`, esc(routeText(m, '\u2192')), statusCell(m, all), esc(m.notes)])).join(''), caption));
  return `<div class="sheet-page"><h2 class="text-xl font-bold">${esc(settings().title)}: Daily Report</h2>
    <p class="text-sm">${stamp()}</p>
    <p class="mt-1 text-xs">Total offices: ${list.length} | ${STAGES.map(s => `${s.label}: ${list.filter(o => o.stage === s.id).length}`).join(' | ')}</p>
    <h3 class="report-heading mt-4 text-base font-bold border-b-2 border-slate-800 pb-1">1. Status Filter Summary</h3>
    <div class="no-print mt-2 space-y-2">
      <div class="flex flex-wrap gap-1.5">${PRESETS.map((p, i) => `<button type="button" class="btn ${p === preset ? 'btn-primary' : ''}" aria-pressed="${p === preset}" data-act="preset" data-preset="${i}">${p.label}</button>`).join('')}</div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs">${STAGES.map(s => `<label class="inline-flex items-center gap-1"><input type="checkbox" data-change="report-stage" value="${s.id}" ${reportStages.has(s.id) ? 'checked' : ''}> ${s.label}</label>`).join('')}</div>
    </div>
    <p class="report-heading mt-2 mb-1 text-sm"><b>Filter:</b> ${filterName} (${plural(matches.length, 'office')})</p>
    <div id="statusResults">${matches.length ? table(['Office', 'Occupant', 'Stage', 'Next move', 'Notes'], [15, 20, 19, 22, 24],
      matches.map(o => row([`<b>${esc(o.name)}</b>`, esc(o.occupant || 'Vacant') + (o.cleared && o.occupant ? ' (cleared)' : '') + (o.incoming ? `<br>Incoming: ${esc(o.incoming)}` : ''),
        stageOf(o.stage).label + (o.cleared ? '<br>Cleared' : ''), nextFor(o), esc(o.notes)])).join('')) : empty('No offices match this filter.')}</div>
    <h3 class="report-heading mt-5 text-base font-bold border-b-2 border-slate-800 pb-1">2. Daily Move Schedule</h3>
    <label class="no-print mt-2 block text-sm">Show <select class="field !w-64" data-change="report-range">${optionList(ranges, reportRange)}</select></label>
    <p class="report-heading mt-2 mb-1 text-sm"><b>Showing:</b> ${ranges.find(r => r[0] === reportRange)[1]} (${plural(upcoming.length, 'move')})</p>
    <div id="scheduleResults">${upcoming.length ? schedule(upcoming) : empty('No moves scheduled in this period.')}
    ${overdue.length ? `<h4 class="report-heading mt-4 mb-1 text-sm font-bold">Past due: not marked done (${overdue.length})</h4>${schedule(overdue)}` : ''}</div></div>`;
}

function renderSheet() {
  const body = $('sheetBody'), scroll = body.scrollTop;
  if (sheet.type === 'report') body.innerHTML = reportPage();
  else if (sheet.type === 'master') body.innerHTML = masterPage();
  else if (sheet.type === 'team' && teamOf(sheet.team)) body.innerHTML = teamPage(sheet.team);
  else if (sheet.type === 'packet') body.innerHTML = masterPage() + settings().teams.filter(t => teamMoves(t.id).length).map(t => teamPage(t.id)).join('');
  body.scrollTop = scroll;
}
function openSheet(next) {
  sheet = next;
  showModal('sheetModal');
  renderSheet();
  $('sheetBody').scrollTop = 0;
  $('printBtn').focus();
}

function bulkAdd() {
  const taken = new Set(offices().map(o => o.name.toLowerCase()));
  const added = [];
  let skipped = 0;
  for (const line of $('bulkText').value.split('\n')) {
    if (!line.trim()) continue;
    const [name = '', occupant = '', incoming = ''] = line.split(line.includes('\t') ? '\t' : ',').map(x => x.trim());
    if (!name || taken.has(name.slice(0, 60).toLowerCase())) { skipped++; continue; }
    const office = normalizeOffice({ id: newId('o'), name, occupant, incoming, stage: $('bulkStage').value, cleared: !occupant });
    taken.add(office.name.toLowerCase());
    added.push(office);
  }
  if (!added.length) return toast(skipped ? 'Nothing added: those offices already exist or have no name.' : 'Type or paste some offices first.');
  $('bulkText').value = '';
  transact(`add ${plural(added.length, 'office')}`, set => added.forEach(o => set('offices', o.id, o)));
  toast(`Added ${plural(added.length, 'office')}${skipped ? `, skipped ${skipped} duplicate or blank` : ''}.`);
}

function exportBackup() {
  download(`move-tracker-backup-${todayKey()}.json`, JSON.stringify({ app: 'office-move-tracker', version: 2, ...state }, null, 2), 'application/json');
}
function exportCSV() {
  // A leading apostrophe stops spreadsheet programs from running typed text as a formula.
  const cell = v => { let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
  const lines = [['Date', 'Start', 'Minutes', 'Who', 'From', 'To', 'Team', 'Status', 'Notes'],
    ...moves().sort(byWhen).map(m => [m.date, m.time, m.duration, m.person, officeName(m.fromId), officeName(m.toId), teamName(teamIdOf(m)), m.status, m.notes])];
  download(`moves-${todayKey()}.csv`, '﻿' + lines.map(l => l.map(cell).join(',')).join('\r\n'), 'text/csv');
}
async function importBackup(file) {
  let next;
  try {
    const data = JSON.parse(await file.text());
    if (data.app === 'office-move-tracker') next = cleanState(data);
    else if (Array.isArray(data.rooms)) next = migrateV1(data);
    else throw new Error('Not a move tracker backup');
  } catch (err) {
    return toast('That file is not a move tracker backup. Nothing was changed.');
  }
  const n = Object.keys(next.offices).length, m = Object.keys(next.moves).length;
  if (!await ask('Restore backup?', `This replaces everything with ${plural(n, 'office')} and ${plural(m, 'move')} from the file. You can Undo right afterward.`, 'Replace')) return;
  transact('restore backup', set => {
    for (const coll of COLLECTIONS) {
      Object.keys(state[coll]).forEach(id => set(coll, id, null));
      Object.entries(next[coll]).forEach(([id, val]) => set(coll, id, val));
    }
  });
  render(true);
  toast('Backup restored.');
}

/* ================= Firebase sign-in and sync ================= */
const SDK = 'https://www.gstatic.com/firebasejs/13.4.0/';
let authApi = null, auth = null;

function waitScreen(html) {
  $('waitScreen').classList.toggle('hidden', !html);
  $('waitBody').innerHTML = html || '';
}
const authMessage = err => ({
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/invalid-email': 'That email address is not valid.',
  'auth/missing-email': 'Enter your email address first.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
  'auth/network-request-failed': 'No connection. Check your internet and try again.',
  'auth/operation-not-allowed': 'Enable Email/Password sign-in in the Firebase console.',
  'auth/user-disabled': 'This account has been disabled.'
}[err.code] || `Sign-in problem: ${err.code || err.message}`);

async function resetPassword() {
  const email = $('lEmail').value.trim();
  if (!email) { $('loginError').textContent = 'Enter your email address first.'; return; }
  try {
    await authApi.sendPasswordResetEmail(auth, email);
    $('loginError').textContent = 'If that account exists, a reset email is on its way.';
  } catch (err) { $('loginError').textContent = authMessage(err); }
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!auth) return;
  $('loginBtn').disabled = true;
  $('loginError').textContent = '';
  try {
    await authApi.signInWithEmailAndPassword(auth, $('lEmail').value.trim(), $('lPassword').value);
    $('lPassword').value = '';
  } catch (err) { $('loginError').textContent = authMessage(err); }
  $('loginBtn').disabled = false;
});

async function startCloud(config) {
  $('app').classList.add('hidden');
  waitScreen('<p class="font-semibold">Connecting...</p>');
  let appApi, fs, db;
  try {
    [appApi, authApi, fs] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(`${SDK}firebase-${n}.js`)));
    const fbApp = appApi.initializeApp(config);
    auth = authApi.initializeAuth(fbApp, { persistence: [authApi.indexedDBLocalPersistence, authApi.browserLocalPersistence] });
    try { db = fs.initializeFirestore(fbApp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch (_) { db = fs.getFirestore(fbApp); }
  } catch (err) {
    console.warn(err);
    // Never fall back to local data here: edits would silently diverge from the cloud copy.
    waitScreen(`<h2 class="text-lg font-bold">Couldn't connect</h2><p class="text-sm">Check your internet connection and the FIREBASE_CONFIG block at the top of this file.</p>
      <p class="text-xs text-slate-500 break-words">${esc(err.message)}</p><button type="button" class="btn btn-primary" data-act="retry">Try again</button>`);
    return;
  }

  let unsubscribe = [];
  const detach = () => { unsubscribe.forEach(stop => stop()); unsubscribe = []; };

  authApi.onAuthStateChanged(auth, user => {
    detach();
    closeModal();
    state = emptyState();
    undoStack.length = 0;
    cloud = null;
    $('app').classList.add('hidden');
    if (!user) { waitScreen(''); $('loginScreen').classList.remove('hidden'); $('lEmail').focus(); return; }
    $('loginScreen').classList.add('hidden');
    waitScreen('<p class="font-semibold">Loading your moves...</p>');

    const ref = coll => fs.collection(db, 'moveTracker', 'main', coll);
    const meta = {};
    let failedWrite = false;
    const status = () => {
      const all = Object.values(meta);
      const text = failedWrite ? 'Sync error' : all.some(m => m.hasPendingWrites) ? (navigator.onLine ? 'Saving...' : 'Offline: will sync later')
        : all.some(m => m.fromCache) ? 'Offline: showing saved copy' : 'Synced to cloud';
      $('syncStatus').textContent = text;
    };
    const offerUpload = () => {
      const confirmedEmpty = COLLECTIONS.every(c => meta[c] && !meta[c].fromCache) && !offices().length && !moves().length;
      const local = confirmedEmpty ? readLocal() : emptyState();
      const n = Object.keys(local.offices).length, m = Object.keys(local.moves).length;
      if (confirmedEmpty && (n || m)) showBanner(`The cloud is empty. This browser has ${plural(n, 'office')} and ${plural(m, 'move')}.`, 'Upload');
      else if (!failedWrite) showBanner('');
    };
    const sync = {
      uid: user.uid,
      email: user.email,
      write(changes) {
        for (let i = 0; i < changes.length; i += 400) {
          const batch = fs.writeBatch(db);
          changes.slice(i, i + 400).forEach(({ coll, id, val }) => {
            const target = fs.doc(ref(coll), id);
            val === null ? batch.delete(target) : batch.set(target, val);
          });
          // Not awaited: while offline this resolves only after reconnecting.
          batch.commit().catch(err => {
            console.warn(err);
            failedWrite = true;
            status();
            showBanner(`A change could NOT be saved to the cloud (${err.code || err.message}). Download a backup in Settings, then reload.`);
          });
        }
      },
      upload() {
        const local = readLocal();
        transact('upload this browser\'s data', set => COLLECTIONS.forEach(c => Object.entries(local[c]).forEach(([id, val]) => set(c, id, val))));
        showBanner('');
        toast('Uploading to the cloud.');
      },
      async signOut() {
        const pending = Object.values(meta).some(m => m.hasPendingWrites);
        if (pending && !await ask('Unsynced changes', 'Some changes have not reached the cloud yet. Signing out now will lose them.', 'Sign out anyway')) return;
        detach();
        await authApi.signOut(auth);
        // Remove the offline copy from this computer.
        try { await fs.terminate(db); await fs.clearIndexedDbPersistence(db); } catch (err) { console.warn(err); }
        location.reload();
      }
    };

    unsubscribe = COLLECTIONS.map(coll => fs.onSnapshot(ref(coll), { includeMetadataChanges: true }, snap => {
      const first = !cloud;
      const changed = !meta[coll] || snap.docChanges().length > 0;
      meta[coll] = snap.metadata;
      state[coll] = cleanState({ [coll]: Object.fromEntries(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }])) })[coll];
      if (!COLLECTIONS.every(c => meta[c])) return;
      cloud = sync;
      if (first) { waitScreen(''); $('app').classList.remove('hidden'); }
      status();
      offerUpload();
      if (first || changed) render();
    }, err => {
      console.warn(err);
      detach();
      cloud = null;
      $('app').classList.add('hidden');
      closeModal();
      const denied = err.code === 'permission-denied';
      waitScreen(`<h2 class="text-lg font-bold">${denied ? 'One more step: publish your security rules' : 'Couldn\'t load your data'}</h2>
        <p class="text-sm">${denied ? 'You are signed in, but the database is not allowing this account yet. In the Firebase console open Firestore Database &gt; Rules, replace everything with the text below, click Publish, wait a minute, then try again.' : esc(err.message)}</p>
        ${denied ? `<pre class="overflow-x-auto rounded bg-slate-900 text-slate-100 p-2 text-[11px]">${esc(rulesFor(user.uid))}</pre>` : ''}
        <div class="flex gap-2">${denied ? '<button type="button" class="btn" data-act="copy-uid-rules">Copy rules</button>' : ''}<button type="button" class="btn btn-primary" data-act="retry">Try again</button></div>`);
      ACTIONS['copy-uid-rules'] = () => copyText(rulesFor(user.uid), 'Rules copied.');
    }));
  });
}

/* ================= Startup ================= */
function startLocal() {
  state = readLocal();
  // First run after upgrading from version 1: save in the new format right away.
  try { if (localStorage.getItem(KEY) === null && (offices().length || moves().length)) writeLocal(); } catch (_) {}
  $('syncStatus').textContent = 'Saved on this computer only';
  window.addEventListener('storage', e => {
    if (e.key !== KEY && e.key !== null) return;
    state = readLocal();
    undoStack.length = 0;
    render();
  });
}

const config = window.FIREBASE_CONFIG;
const useCloud = !!(config && config.apiKey && config.projectId);
if (!useCloud) startLocal();
const firstDay = nextMoveDay();
if (firstDay) dFrom = dTo = firstDay;
render();
if (useCloud) startCloud(config);

// Refresh "Today" and "Past due" labels when the page stays open past midnight.
let renderedDay = todayKey();
setInterval(() => { if (todayKey() !== renderedDay) { renderedDay = todayKey(); render(); } }, 60000);
})();
</script>
</body>
</html>
