/* ============================================
   TOKENS — Identical to Minnesota Then brand
   ============================================ */
:root {
  --navy:         #08111F;
  --navy-mid:     #0D1E35;
  --blue:         #0D47A1;
  --blue-mid:     #1565C0;
  --blue-light:   #1E88E5;
  --blue-pale:    #EDF3FD;
  --accent:       #E55A00;
  --accent-hover: #CC5000;
  --accent-glow:  rgba(229, 90, 0, 0.22);
  --white:        #FFFFFF;
  --off-white:    #F7F5F0;
  --parchment:    #F2EFE8;
  --rule:         rgba(0,0,0,0.08);
  --rule-light:   rgba(255,255,255,0.12);
  --gray-200:     #E8E6E1;
  --gray-400:     #9E9A93;
  --gray-600:     #5C5A56;
  --gray-800:     #1A1917;

  --font-display: 'Playfair Display', Georgia, serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 12px;

  --shadow-sm:   0 2px 8px rgba(0,0,0,0.06);
  --shadow-card: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lift: 0 12px 40px rgba(0,0,0,0.10);
  --shadow-deep: 0 24px 64px rgba(0,0,0,0.14);

  --section-pad: 6rem;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  color: var(--gray-800);
  background: var(--white);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-fontg: grayscale;
  overflow-y: scroll;
  scrollbar-gutter: stable;
}
body.modal-open { overflow: hidden; padding-right: var(--scrollbar-width, 0px); }
img { display: block; max-width: 100%; height: auto; }
a { text-decoration: none; color: inherit; }

/* ============================================
   CARTOGRAPHIC DIVIDER
   ============================================ */
.section-rule {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  margin-bottom: 1.1rem;
}
.section-rule::before, .section-rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule);
}
.section-rule::before { max-width: 2rem; }
.section-rule-pin {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
}
.section-rule-pin i { font-size: 0.6rem; }

/* ============================================
   HEADER
   ============================================ */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.5rem;
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(68px + env(safe-area-inset-top, 0px));
  background: rgba(255, 255, 255, 0.90);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--rule);
  transition: background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
}
.site-header.scrolled {
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 1px 0 var(--rule), 0 4px 24px rgba(0,0,0,0.06);
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  color: var(--navy);
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  transition: opacity 0.2s;
}
.header-logo:hover { opacity: 0.8; }
.header-logo img { height: 30px; width: auto; }

.header-nav { display: flex; align-items: center; gap: 0.25rem; list-style: none; }
.header-nav a {
  color: var(--gray-600);
  font-size: 0.84rem;
  font-weight: 500;
  padding: 0.45rem 0.95rem;
  border-radius: var(--radius-md);
  transition: color 0.18s, background 0.18s;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.header-nav a:hover { color: var(--navy); background: var(--parchment); }
.header-nav .nav-cta {
  color: var(--white);
  background: var(--accent);
  padding: 0.5rem 1.2rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.84rem;
  margin-left: 0.5rem;
  transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
}
.header-nav .nav-cta:hover {
  background: var(--accent-hover);
  color: var(--white);
  transform: translateY(-1px);
  box-shadow: 0 4px 18px var(--accent-glow);
}

.hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  width: 44px;
  height: 44px;
}
.hamburger span {
  display: block;
  height: 1.5px;
  background: var(--navy);
  border-radius: 2px;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  transform-origin: center;
}
.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.hamburger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

.mobile-menu {
  display: flex;
  position: fixed;
  top: calc(68px + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0;
  background: var(--white);
  padding: 2rem 2rem 3rem;
  z-index: 899;
  flex-direction: column;
  gap: 0;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu a {
  color: var(--navy);
  font-size: 1.15rem;
  font-weight: 500;
  padding: 1.1rem 0;
  border-bottom: 1px solid var(--rule);
  display: block;
  font-family: var(--font-display);
  transition: color 0.18s;
}
.mobile-menu a:hover { color: var(--accent); }
.mobile-menu a.mobile-cta {
  margin-top: 2rem;
  background: var(--accent);
  color: var(--white);
  text-align: center;
  padding: 1rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-family: var(--font-body);
  font-size: 1rem;
  border-bottom: none;
}

/* ============================================
   SUBPAGE HERO (Adapted for B2B)
   ============================================ */
.subpage-hero {
  position: relative;
  height: 85vh;
  min-height: 550px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  background: var(--navy);
  padding-top: 68px;
}
.subpage-hero .hero-bg {
  position: absolute;
  inset: 0;
  background-image: url('https://www.mnthen.com/images/header/index_header.jpg'); /* Replace with your own B2B hero image if desired */
  background-size: cover;
  background-position: center 30%;
  opacity: 0.35;
  transform: scale(1.02);
  transition: transform 8s ease;
}
.subpage-hero.loaded .hero-bg { transform: scale(1); }
.subpage-hero .hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(8,17,31,0.7) 0%,
    rgba(8,17,31,0.4) 50%,
    rgba(8,17,31,0.9) 100%);
}
.subpage-hero .hero-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(8,17,31,0.6) 100%);
  z-index: 1;
}
.subpage-hero .hero-content {
  position: relative;
  z-index: 2;
  max-width: 820px;
  padding: 0 2rem;
}
.subpage-hero .hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 1.5rem;
  padding: 0.45rem 1rem;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 2rem;
  backdrop-filter: blur(4px);
}
.subpage-hero .hero-eyebrow i { color: var(--accent); font-size: 0.55rem; }
.subpage-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 6vw, 4.5rem);
  font-weight: 900;
  color: var(--white);
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin-bottom: 1.5rem;
  text-shadow: 0 2px 30px rgba(0,0,0,0.35);
}
.subpage-hero h1 em { font-style: italic; color: var(--accent); }
.subpage-hero .hero-sub {
  font-size: clamp(1rem, 1.8vw, 1.15rem);
  color: rgba(255,255,255,0.8);
  font-weight: 300;
  max-width: 600px;
  margin: 0 auto 2.5rem;
  line-height: 1.8;
}
.hero-actions { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; }

/* ============================================
   BUTTONS
   ============================================ */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--accent);
  color: var(--white);
  font-size: 0.92rem;
  font-weight: 600;
  padding: 0.95rem 2.1rem;
  border-radius: var(--radius-md);
  border: none;
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
}
.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px var(--accent-glow);
}
.btn-white {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--white);
  color: var(--blue);
  font-size: 0.95rem;
  font-weight: 700;
  padding: 0.95rem 2.1rem;
  border-radius: var(--radius-md);
  letter-spacing: 0.01em;
  transition: transform 0.18s, box-shadow 0.18s;
}
.btn-white:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.18);
}
.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: transparent;
  color: rgba(255,255,255,0.85);
  font-size: 0.92rem;
  font-weight: 500;
  padding: 0.95rem 1.8rem;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255,255,255,0.22);
  transition: background 0.18s, border-color 0.18s;
}
.btn-ghost:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.4);
}

/* ============================================
   CONTENT SECTIONS
   ============================================ */
.content-section { background: var(--white); padding: var(--section-pad) 2rem; }
.content-section.alt-bg { background: var(--off-white); }
.content-inner { max-width: 1100px; margin: 0 auto; }

.section-intro { text-align: center; max-width: 720px; margin: 0 auto 3.5rem; }
.section-intro .section-rule { justify-content: center; }
.section-intro h2 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 3vw, 2.4rem);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.15;
  letter-spacing: -0.025em;
  margin-bottom: 1rem;
}
.section-intro p { font-size: 1rem; color: var(--gray-600); line-height: 1.8; }

/* Feature Cards */
.features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.feature-card {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: 2.25rem 2rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
}
.feature-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lift);
  border-color: transparent;
}
.feature-icon {
  font-size: 1.5rem;
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  background: rgba(229,90,0,0.07);
  border-radius: var(--radius-md);
  margin: 0 auto 1.25rem;
}
.feature-card h3 {
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 0.6rem;
  letter-spacing: -0.01em;
}
.feature-card p { font-size: 0.875rem; color: var(--gray-600); line-height: 1.7; }

/* ============================================
   PRICING / LICENSING CARD
   ============================================ */
.license-card {
  background: var(--white);
  border: 1px solid var(--rule);
  border-top: 4px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: 3rem 2.5rem;
  box-shadow: var(--shadow-lift);
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}
.license-card h3 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 0.5rem;
}
.license-price {
  font-family: var(--font-display);
  font-size: 3rem;
  font-weight: 900;
  color: var(--accent);
  margin: 1rem 0;
  letter-spacing: -0.03em;
}
.license-price span { font-size: 1rem; font-weight: 500; color: var(--gray-600); font-family: var(--font-body); }
.license-features {
  list-style: none;
  text-align: left;
  margin: 2rem 0;
  padding: 0;
}
.license-features li {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--rule);
  color: var(--gray-600);
  font-size: 0.9rem;
}
.license-features li:last-child { border-bottom: none; }
.license-features li i { color: var(--accent); margin-top: 3px; flex-shrink: 0; }
.license-features li strong { color: var(--navy); font-weight: 600; }
.license-disclaimer {
  font-size: 0.75rem;
  color: var(--gray-400);
  margin-top: 1.5rem;
  line-height: 1.6;
  font-style: italic;
}

/* ============================================
   TECH SPECS LIST
   ============================================ */
.tech-specs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-top: 2rem;
}
.spec-item {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
}
.spec-item i {
  color: var(--blue);
  font-size: 1.1rem;
  margin-top: 2px;
}
.spec-item h4 {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 0.3rem;
}
.spec-item p {
  font-size: 0.85rem;
  color: var(--gray-600);
  line-height: 1.6;
}

/* ============================================
   FOOTER
   ============================================ */
.site-footer {
  background: var(--navy);
  padding: 5rem 2rem 2.5rem;
  color: rgba(255,255,255,0.55);
}
.footer-inner { max-width: 1200px; margin: 0 auto; }
.footer-top {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 3rem;
  padding-bottom: 3rem;
  border-bottom: 1px solid var(--rule-light);
  margin-bottom: 2.5rem;
}
.footer-brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 1rem;
}
.footer-brand img { height: 26px; width: auto; }
.footer-tagline { font-size: 0.875rem; line-height: 1.7; color: rgba(255,255,255,0.45); max-width: 220px; }
.footer-col h4 {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 1.25rem;
}
.footer-col ul { list-style: none; }
.footer-col li { margin-bottom: 0.6rem; }
.footer-col a { font-size: 0.875rem; color: rgba(255,255,255,0.55); transition: color 0.18s; }
.footer-col a:hover { color: var(--white); }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
.footer-copy { font-size: 0.775rem; color: rgba(255,255,255,0.3); }

/* ============================================
   SCROLL REVEAL
   ============================================ */
.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal.visible { opacity: 1; transform: none; }
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 960px) {
  .header-nav { display: none; }
  .hamburger { display: flex; }
  .site-header { padding: 0 1.5rem; }
  .features-grid { grid-template-columns: 1fr 1fr; }
  .tech-specs { grid-template-columns: 1fr; }
  .footer-top { grid-template-columns: 1fr 1fr; gap: 2.5rem; }
}
@media (max-width: 640px) {
  :root { --section-pad: 4rem; }
  .subpage-hero { min-height: 100svh; padding-top: calc(68px + env(safe-area-inset-top, 0px)); }
  .content-section { padding: var(--section-pad) 1.25rem; }
  .features-grid { grid-template-columns: 1fr; }
  .footer-top { grid-template-columns: 1fr; gap: 2rem; }
  .footer-bottom { flex-direction: column; align-items: flex-start; }
  .hero-actions { flex-direction: column; width: 100%; }
  .hero-actions a, .hero-actions button { width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .reveal { opacity: 1; transform: none; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

document.addEventListener('DOMContentLoaded', function () {
  /* Measure scrollbar width */
  var scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
  document.documentElement.style.setProperty('--scrollbar-width', scrollbarWidth + 'px');

  /* Footer year */
  var yearSpan = document.getElementById('current-year');
  if (yearSpan) yearSpan.textContent = new Date().getFullYear();

  /* Header scroll */
  var header = document.getElementById('siteHeader');

    header.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive: true });

  /* Hero load animation */

  if (heroSection) {

  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () {
      menu.classList.remove('open');
      btn.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Open menu');
      document.body.style.overflow = '';
    });
  });

  /* Scroll reveal */
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -32px 0px' });
    reveals.forEach(function (el) { observer.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add('visible'); });
  }
});
