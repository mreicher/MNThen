<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PMTiles Header Inspector</title>
</head>
<body>
    <h2>PMTiles Bounding Box Extractor</h2>
    <button id="pick">Select map.pmtiles</button>
    <pre id="output" style="background:#f4f4f4; padding:15px; margin-top:15px;"></pre>

    <script type="module">
        import * as pmtiles from "https://unpkg.com/pmtiles@3.2.0/dist/index.js";

        document.getElementById('pick').addEventListener('click', async () => {
            const output = document.getElementById('output');
            try {
                const [fileHandle] = await window.showOpenFilePicker();
                const file = await fileHandle.getFile();
                
                const p = new pmtiles.PMTiles(file);
                const header = await p.getHeader();
                
                output.textContent = 
                    `--- PMTILES BOUNDING BOX ---\n` +
                    `Min Lon: ${header.minLon}\n` +
                    `Min Lat: ${header.minLat}\n` +
                    `Max Lon: ${header.maxLon}\n` +
                    `Max Lat: ${header.maxLat}\n\n` +
                    `Copy-paste format (--bbox):\n` +
                    `${header.minLon},${header.minLat},${header.maxLon},${header.maxLat}`;
            } catch (err) {
                output.textContent = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
