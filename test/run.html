<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple GPS Running Tracker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #fff; }
        .stat-box {
            margin: 1.5rem 0;
        }
        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 1rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 0.5rem;
            width: 80%;
        }
        .controls button.stop {
            background-color: #f44336;
        }
        .controls button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #ff9800;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Run Tracker</h1>
    
    <div class="stat-box">
        <div class="stat-value" id="distance">0.00</div>
        <div class="stat-label">Miles</div>
    </div>

    <div class="stat-box">
        <div class="stat-value" id="timer">00:00:00</div>
        <div class="stat-label">Time</div>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startTracking()">Start Run</button>
        <button id="stopBtn" class="stop" onclick="stopTracking()" disabled>Stop Run</button>
    </div>

    <div id="status">Ready to track</div>
</div>

<script>
    let watchId = null;
    let totalDistance = 0;
    let lastLat = null;
    let lastLon = null;
    
    let startTime = null;
    let timerInterval = null;

    const distanceEl = document.getElementById('distance');
    const timerEl = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');

    function startTracking() {
        if (!navigator.geolocation) {
            statusEl.textContent = "Geolocation is not supported by your browser.";
            return;
        }

        totalDistance = 0;
        lastLat = null;
        lastLon = null;
        distanceEl.textContent = "0.00";
        timerEl.textContent = "00:00:00";
        
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent = "Acquiring GPS signal...";

        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);

        watchId = navigator.geolocation.watchPosition(updatePosition, handleError, {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        });
    }

    function stopTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        if (timerInterval !== null) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusEl.textContent = "Run stopped.";
    }

    function updateTimer() {
        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        const hours = String(Math.floor(elapsedTime / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((elapsedTime % 3600) / 60)).padStart(2, '0');
        const seconds = String(elapsedTime % 60).padStart(2, '0');
        timerEl.textContent = `${hours}:${minutes}:${seconds}`;
    }

    function updatePosition(position) {
        statusEl.textContent = "Tracking active...";
        const currentLat = position.coords.latitude;
        const currentLon = position.coords.longitude;

        if (lastLat !== null && lastLon !== null) {
            const distanceDeltaKm = calculateDistance(lastLat, lastLon, currentLat, currentLon);
            const distanceDeltaMiles = distanceDeltaKm * 0.621371; // Convert km to miles
            
            // Ignore minor jitter if movement is less than approx 6.5 feet (2 meters) at once
            if (distanceDeltaKm > 0.002) {  
                totalDistance += distanceDeltaMiles;
                distanceEl.textContent = totalDistance.toFixed(2);
            }
        }

        lastLat = currentLat;
        lastLon = currentLon;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Radius of the earth in km
        const dLat = deg2rad(lat2 - lat1);
        const dLon = deg2rad(lon2 - lon1);
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        return R * c; 
    }

    function deg2rad(deg) {
        deg * (Math.PI/180);
        return deg * (Math.PI/180);
    }

    function handleError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                statusEl.textContent = "User denied the request for Geolocation.";
                break;
            case error.POSITION_UNAVAILABLE:
                statusEl.textContent = "Location information is unavailable.";
                break;
            case error.TIMEOUT:
                statusEl.textContent = "The request to get user location timed out.";
                break;
            default:
                statusEl.textContent = "An unknown error occurred.";
                break;
        }
        stopTracking();
    }
</script>

</body>
</html>
