<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Question</title>
  <style>
    /* Overall Styling */
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Header */
    header {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    /* Inline Auth Bar in Header */
    .auth-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-container input {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .auth-container button, .user-status button {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .auth-container button:hover, .user-status button:hover {
      background-color: #d35400;
    }

    .user-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    /* Container */
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Question Form */
    .question-form {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-gap: 20px;
    }

    .question-form label {
      font-weight: bold;
      color: #2c3e50;
    }

    .question-form input[type="text"],
    .question-form select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    .question-form input[type="text"]:focus,
    .question-form select:focus {
      outline: none;
      border-color: #e67e22;
    }

    .question-form select {
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%232c3e50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 32px;
    }

    .question-form input[type="submit"] {
      width: auto;
      justify-self: center;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .question-form input[type="submit"]:hover {
      background-color: #d35400;
    }

    .question-form input[type="submit"]:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
      }

      header h1 {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Minnesota Then</h1>
    
    <!-- Login Form View (Visible when logged out) -->
    <div id="login-section" class="auth-container">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button id="login-btn" type="button">Log In</button>
    </div>

    <!-- User Status View (Visible when logged in) -->
    <div id="user-section" class="user-status hidden">
      <span id="user-display-email"></span>
      <button id="logout-btn" type="button">Log Out</button>
    </div>
  </header>

  <div class="container">
    <form id="question-form" class="question-form">
      <label for="category">Category:</label>
      <select id="category" required>
        <option value="" selected disabled>Select a category</option>
        <option value="mn-history">MN History</option>
        <option value="gangster-history">Gangster History</option>
        <option value="beer-history">Beer History</option>
        <option value="stp-history">St. Paul History</option>
        <option value="politics-history">Political History</option>
      </select>
      <label for="question">Question:</label>
      <input type="text" id="question" required>
      <label for="option1">Option 1:</label>
      <input type="text" id="option1" required>
      <label for="option2">Option 2:</label>
      <input type="text" id="option2" required>
      <label for="option3">Option 3:</label>
      <input type="text" id="option3" required>
      <label for="option4">Option 4:</label>
      <input type="text" id="option4" required>
      <label for="hint">Hint:</label>
      <input type="text" id="hint" required>
      <label for="correct-answer">Correct Answer:</label>
      <input type="text" id="correct-answer" required>
      <input type="submit" value="Submit" id="submit-btn" disabled>
    </form>
  </div>

  <!-- Load Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.3.2/firebase-database.js"></script>

  <script>
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBDUAF3qJGhLYQJPHyWwY0JzonN5l8ERzE",
      authDomain: "mnthen-3151d.firebaseapp.com",
      projectId: "mnthen-3151d",
      storageBucket: "mnthen-3151d.appspot.com",
      messagingSenderId: "416231360428",
      appId: "1:416231360428:web:36f69cc231be2d84a8dc09"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(app);
    const database = firebase.database();

    // DOM Elements
    const loginSection = document.getElementById('login-section');
    const userSection = document.getElementById('user-section');
    const userDisplayEmail = document.getElementById('user-display-email');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const submitBtn = document.getElementById('submit-btn');
    const questionForm = document.getElementById('question-form');

    // Auth State Observer
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        // User is logged in
        loginSection.classList.add('hidden');
        userSection.classList.remove('hidden');
        userDisplayEmail.textContent = user.email;
        submitBtn.disabled = false;
      } else {
        // User is not logged in
        loginSection.classList.remove('hidden');
        userSection.classList.add('hidden');
        userDisplayEmail.textContent = '';
        submitBtn.disabled = true;
      }
    });

    // Handle Login Button Click
    loginBtn.addEventListener('click', () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alert('Please enter both email and password.');
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .catch((error) => {
          console.error('Error signing in:', error.code, error.message);
          alert('Login failed: ' + error.message);
        });
    });

    // Handle Logout Button Click
    logoutBtn.addEventListener('click', () => {
      auth.signOut()
        .then(() => {
          document.getElementById('login-email').value = '';
          document.getElementById('login-password').value = '';
        })
        .catch((error) => {
          console.error('Error signing out:', error);
        });
    });

    // Handle Question Submission
    questionForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const user = auth.currentUser;
      if (user) {
        const category = document.getElementById('category').value;
        const question = document.getElementById('question').value;
        const option1 = document.getElementById('option1').value;
        const option2 = document.getElementById('option2').value;
        const option3 = document.getElementById('option3').value;
        const option4 = document.getElementById('option4').value;
        const correctAnswer = document.getElementById('correct-answer').value;

        const newQuestion = {
          text: question,
          options: [option1, option2, option3, option4],
          correctAnswer: correctAnswer,
          hint: document.getElementById('hint').value
        };

        let questionRef;
        if (category === 'mn-history') {
          questionRef = database.ref('mn_history_questions');
        } else if (category === 'gangster-history') {
          questionRef = database.ref('gangster_history_questions');
        } else if (category === 'sports-history') {
          questionRef = database.ref('sports_history_questions');
        } else if (category === 'beer-history') {
          questionRef = database.ref('beer_history_questions');
        } else if (category === 'stp-history') {
          questionRef = database.ref('stp_history_questions');
        } else if (category === 'politics-history') {
          questionRef = database.ref('politics_history_questions');
        } else {
          alert('Invalid category selected.');
          return;
        }

        const newQuestionRef = questionRef.push();
        newQuestionRef.set(newQuestion)
          .then(() => {
            questionRef.once('value', (snapshot) => {
              const totalQuestions = Object.keys(snapshot.val() || {}).length;
              alert(`Question added successfully!\n\nTotal Questions Uploaded: ${totalQuestions}`);
            });

            questionForm.reset();
          })
          .catch((error) => {
            console.error('Error adding question:', error);
          });
      } else {
        alert('You must be signed in to add questions.');
      }
    });
  </script>
</body>
</html>
