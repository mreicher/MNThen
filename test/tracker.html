<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>66-Day Weight Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    #app {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .screen {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    h1, h2 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }

    p {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.95rem;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .secondary-btn {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .secondary-btn:hover {
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    header h2 {
      font-size: 1.2rem;
    }

    header button {
      width: auto;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    .stats-card {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stats-card span {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.2rem;
    }

    #chart-container {
      margin-top: 1rem;
      height: 150px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 4px;
    }

    .bar {
      flex: 1;
      background-color: var(--primary);
      border-radius: 4px 4px 0 0;
      transition: height 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Auth Screen -->
    <section id="auth-screen" class="screen">
      <h1>66-Day Challenge</h1>
      <p>Track your weight daily, build lasting habits, and visualize your progress over 66 days.</p>
      <button id="google-login-btn">Sign in with Google</button>
    </section>

    <!-- Dashboard Screen -->
    <section id="dashboard-screen" class="screen hidden">
      <header>
        <h2>Day <span id="current-day">1</span> of 66</h2>
        <button id="logout-btn" class="secondary-btn">Sign Out</button>
      </header>
      
      <main style="display: flex; flex-direction: column; gap: 1.2rem;">
        <form id="weight-form">
          <label for="weight-input">Today's Weight (lbs)</label>
          <input type="number" id="weight-input" step="0.1" placeholder="e.g. 175.5" required>
          <button type="submit">Log Weight</button>
        </form>

        <div class="stats-card">
          <p>Total Net Change: <span id="total-change">0.0</span> lbs</p>
        </div>

        <div>
          <label>Progress History</label>
          <div id="chart-container">
            <!-- Dynamic simple CSS bars -->
          </div>
        </div>
      </main>
    </section>
  </div>

  <!-- Firebase App & Logic Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuration - Replace with your live Firebase credentials
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const authScreen = document.getElementById("auth-screen");
    const dashboardScreen = document.getElementById("dashboard-screen");
    const googleLoginBtn = document.getElementById("google-login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const weightForm = document.getElementById("weight-form");
    const weightInput = document.getElementById("weight-input");
    const totalChangeEl = document.getElementById("total-change");
    const currentDayEl = document.getElementById("current-day");
    const chartContainer = document.getElementById("chart-container");

    let currentUser = null;
    let logs = [];

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.add("hidden");
        dashboardScreen.classList.remove("hidden");
        await fetchLogs();
      } else {
        currentUser = null;
        dashboardScreen.classList.add("hidden");
        authScreen.classList.remove("hidden");
      }
    });

    // Login Handler
    googleLoginBtn.addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Authentication Error:", error);
      }
    });

    // Logout Handler
    logoutBtn.addEventListener("click", () => signOut(auth));

    // Submit Weight Log
    weightForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const weight = parseFloat(weightInput.value);
      const todayKey = new Date().toISOString().split("T")[0];

      try {
        const docRef = doc(db, "users", currentUser.uid, "weights", todayKey);
        await setDoc(docRef, { weight, timestamp: new Date() }, { merge: true });
        weightInput.value = "";
        await fetchLogs();
      } catch (error) {
        console.error("Error saving weight:", error);
      }
    });

    // Fetch Logs from Firestore
    async function fetchLogs() {
      try {
        const q = query(collection(db, "users", currentUser.uid, "weights"), orderBy("timestamp", "asc"));
        const querySnapshot = await getDocs(q);
        logs = [];
        querySnapshot.forEach((doc) => {
          logs.push({ date: doc.id, ...doc.data() });
        });
        updateDashboard();
      } catch (error) {
        console.error("Error fetching logs:", error);
      }
    }

    // Render Dashboard UI
    function updateDashboard() {
      if (logs.length === 0) return;

      currentDayEl.textContent = logs.length;
      
      const firstWeight = logs[0].weight;
      const latestWeight = logs[logs.length - 1].weight;
      const netChange = (latestWeight - firstWeight).toFixed(1);
      
      totalChangeEl.textContent = netChange;

      // Render simple bar chart
      chartContainer.innerHTML = "";
      const weights = logs.map(l => l.weight);
      const minW = Math.min(...weights);
      const maxW = Math.max(...weights);
      const range = maxW - minW || 1;

      logs.forEach(log => {
        const bar = document.createElement("div");
        bar.className = "bar";
        const heightPct = Math.max(15, ((log.weight - minW) / range) * 100);
        bar.style.height = `${heightPct}%`;
        bar.title = `${log.date}: ${log.weight} lbs`;
        chartContainer.appendChild(bar);
      });
    }
  </script>
</body>
</html>
