<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupplyHub Checkout</title>
<style>
:root{--primary:#1e40af;--primary-dark:#1e3a8a;--success:#059669;--danger:#dc2626;--bg:#f1f5f9;--surface:#ffffff;--text:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--border:#e2e8f0;--radius:10px;--radius-sm:6px;--shadow:0 1px 2px 0 rgb(0 0 0 / 0.05);--shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:24px}
.hidden{display:none !important}

.container{max-width:960px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden}
.card-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-header h2{font-size:18px;font-weight:700}
.card-body{padding:24px}

.btn{padding:10px 18px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background 0.15s}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{background:#047857}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#e2e8f0}
.w-full{width:100%}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px}
.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text)}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,0.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}

.checkout-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:24px}
@media(max-width:800px){.checkout-grid{grid-template-columns:1fr}}

.item-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding-right:4px}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;transition:all 0.15s}
.item-row:hover{border-color:var(--primary);background:#f8fafc}
.item-row.selected{border-color:var(--primary);background:#eff6ff}
.item-info h4{font-size:14px;font-weight:700}
.item-info p{font-size:12px;color:var(--text-secondary)}

.cart-items{border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:16px 0;max-height:240px;overflow-y:auto}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border-bottom:none}
.qty-badge{font-weight:700;background:var(--bg);padding:4px 8px;border-radius:4px;border:1px solid var(--border)}

/* Invoice Print View */
.invoice-sheet{background:white;padding:40px;max-width:720px;margin:0 auto}
.invoice-header{display:flex;justify-content:space-between;margin-bottom:30px;padding-bottom:20px;border-bottom:3px solid var(--text)}
.invoice-title{font-size:28px;font-weight:900;letter-spacing:-0.5px}
.invoice-meta{text-align:right;font-size:13px;color:var(--text-secondary);line-height:1.6}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{background:var(--text);color:white;text-transform:uppercase;font-size:11px;letter-spacing:0.5px}

@media print {
  body { background: white; padding: 0; }
  .no-print { display: none !important; }
  .invoice-sheet { padding: 0; max-width: 100%; }
}
</style>
</head>
<body>

<div class="container no-print">
  <div class="card">
    <div class="card-header">
      <h2>Supply Checkout Invoice Generator</h2>
      <button class="btn btn-secondary" onclick="app.resetForm()">🔄 Clear Form</button>
    </div>
    <div class="card-body">
      <div class="checkout-grid">
        <div>
          <div class="form-group">
            <label>Search Supplies</label>
            <input type="text" class="form-control" id="search-box" placeholder="Type to filter items..." oninput="app.renderItems()">
          </div>
          <div class="item-list" id="item-list"></div>
        </div>
        
        <div>
          <div class="form-row">
            <div class="form-group">
              <label>Recipient Name *</label>
              <input type="text" class="form-control" id="recipient" placeholder="e.g. Jane Doe">
            </div>
            <div class="form-group">
              <label>Checkout Date</label>
              <input type="date" class="form-control" id="checkout-date">
            </div>
          </div>
          <div class="form-group">
            <label>Department / Project Notes</label>
            <input type="text" class="form-control" id="notes" placeholder="e.g. Maintenance, Room 304">
          </div>
          
          <div style="font-weight:700;font-size:14px;margin-top:16px;">Selected Items</div>
          <div class="cart-items" id="cart-list">
            <div style="text-align:center;color:var(--text-muted);padding:24px;">No items selected</div>
          </div>
          
          <button class="btn btn-success w-full" onclick="app.generateInvoice()">✅ Generate & Print Invoice</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Printable Invoice Screen -->
<div id="invoice-screen" class="hidden">
  <div class="invoice-sheet">
    <div class="invoice-header">
      <div>
        <div class="invoice-title">SUPPLY CHECKOUT</div>
        <div style="font-size:14px;color:var(--text-secondary);margin-top:4px;">Official Property Issue Receipt</div>
      </div>
      <div class="invoice-meta" id="inv-meta-text"></div>
    </div>
    <div style="margin-bottom:20px;">
      <span style="font-size:12px;text-transform:uppercase;color:var(--text-muted);font-weight:600;">Issued To:</span>
      <p id="inv-recipient" style="font-size:16px;font-weight:700;"></p>
      <p id="inv-notes" style="font-size:13px;color:var(--text-secondary);"></p>
    </div>
    <table>
      <thead>
        <tr>
          <th>Item Description</th>
          <th>Category</th>
          <th style="text-align:right;">Quantity Taken</th>
        </tr>
      </thead>
      <tbody id="inv-table-body"></tbody>
    </table>
    <div style="margin-top:60px;display:flex;justify-content:space-between;" class="no-print">
      <button class="btn btn-secondary" onclick="app.backToApp()">← Back to Checkout</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print Invoice</button>
    </div>
  </div>
</div>

<script>
const app = {
  catalog: [
    { id: 1, name: "Blue Ballpoint Pens (Box)", category: "Stationery" },
    { id: 2, name: "Legal Pads (8.5x11)", category: "Stationery" },
    { id: 3, name: "Nitrile Gloves (Box of 100)", category: "Safety" },
    { id: 4, name: "Disinfectant Wipes", category: "Cleaning" },
    { id: 5, name: "AA Batteries (Pack of 4)", category: "Electronics" },
    { id: 6, name: "AAA Batteries (Pack of 4)", category: "Electronics" },
    { id: 7, name: "Printer Paper (Ream)", category: "Office Supplies" },
    { id: 8, name: "Permanent Markers (Black)", category: "Stationery" },
    { id: 9, name: "Safety Glasses", category: "Safety" },
    { id: 10, name: "Zip Ties (Bag of 100)", category: "Hardware" }
  ],
  cart: {},

  init() {
    document.getElementById("checkout-date").valueAsDate = new Date();
    this.renderItems();
  },

  renderItems() {
    const query = document.getElementById("search-box").value.toLowerCase();
    const container = document.getElementById("item-list");
    
    const filtered = this.catalog.filter(i => 
      i.name.toLowerCase().includes(query) || i.category.toLowerCase().includes(query)
    );

    container.innerHTML = filtered.map(item => {
      const qty = this.cart[item.id] || 0;
      const isSelected = qty > 0;
      return `
        <div class="item-row ${isSelected ? 'selected' : ''}" onclick="app.toggleItem(${item.id})">
          <div class="item-info">
            <h4>${item.name}</h4>
            <p>${item.category}</p>
          </div>
          <div>
            ${isSelected ? `<span class="qty-badge">${qty} selected</span>` : `<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px;">+ Add</button>`}
          </div>
        </div>
      `;
    }).join('');
  },

  toggleItem(id) {
    if (!this.cart[id]) {
      this.cart[id] = 1;
    } else {
      delete this.cart[id];
    }
    this.renderItems();
    this.renderCart();
  },

  updateQty(id, delta) {
    this.cart[id] = (this.cart[id] || 0) + delta;
    if (this.cart[id] <= 0) delete this.cart[id];
    this.renderItems();
    this.renderCart();
  },

  renderCart() {
    const container = document.getElementById("cart-list");
    const ids = Object.keys(this.cart);

    if (ids.length === 0) {
      container.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:24px;">No items selected</div>`;
      return;
    }

    container.innerHTML = ids.map(id => {
      const item = this.catalog.find(i => i.id == id);
      const qty = this.cart[id];
      return `
        <div class="cart-row">
          <div>
            <div style="font-weight:600;font-size:13px;">${item.name}</div>
            <div style="font-size:11px;color:var(--text-secondary);">${item.category}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn btn-secondary" style="padding:2px 6px;" onclick="app.updateQty(${item.id}, -1)">-</button>
            <span style="font-weight:700;min-width:20px;text-align:center;">${qty}</span>
            <button class="btn btn-secondary" style="padding:2px 6px;" onclick="app.updateQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `;
    }).join('');
  },

  generateInvoice() {
    const recipient = document.getElementById("recipient").value.trim();
    if (!recipient) {
      alert("Please enter the recipient's name.");
      document.getElementById("recipient").focus();
      return;
    }
    if (Object.keys(this.cart).length === 0) {
      alert("Please select at least one item for checkout.");
      return;
    }

    const date = document.getElementById("checkout-date").value;
    const notes = document.getElementById("notes").value;
    const invoiceNum = 'INV-' + Math.floor(100000 + Math.random() * 900000);

    document.getElementById("inv-meta-text").innerHTML = `<strong>Invoice #:</strong> ${invoiceNum}<br><strong>Date:</strong> ${date}`;
    document.getElementById("inv-recipient").textContent = recipient;
    document.getElementById("inv-notes").textContent = notes ? `Notes: ${notes}` : '';

    const tbody = document.getElementById("inv-table-body");
    tbody.innerHTML = Object.entries(this.cart).map(([id, qty]) => {
      const item = this.catalog.find(i => i.id == id);
      return `
        <tr>
          <td><strong>${item.name}</strong></td>
          <td>${item.category}</td>
          <td style="text-align:right;font-weight:700;">${qty}</td>
        </tr>
      `;
    }).join('');

    document.querySelector(".container").classList.add("hidden");
    document.getElementById("invoice-screen").classList.remove("hidden");
    window.print();
  },

  backToApp() {
    document.getElementById("invoice-screen").classList.add("hidden");
    document.querySelector(".container").classList.remove("hidden");
  },

  resetForm() {
    this.cart = {};
    document.getElementById("recipient").value = '';
    document.getElementById("notes").value = '';
    document.getElementById("search-box").value = '';
    this.renderItems();
    this.renderCart();
  }
};

app.init();
</script>
</body>
</html>
