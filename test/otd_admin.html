<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Date Information</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Header */
    header {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    /* Inline Auth Bar in Header */
    .auth-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-container input {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .auth-container button, .user-status button {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .auth-container button:hover, .user-status button:hover {
      background-color: #d35400;
    }

    .user-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <h1>Minnesota Then</h1>
    
    <!-- Login Form View (Visible when logged out) -->
    <div id="login-section" class="auth-container">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button id="login-btn" type="button">Log In</button>
    </div>

    <!-- User Status View (Visible when logged in) -->
    <div id="user-section" class="user-status hidden">
      <span id="user-display-email"></span>
      <button id="logout-btn" type="button">Log Out</button>
    </div>
  </header>

  <div class="container">
    <h1 class="text-center mb-4">Admin - Date Information</h1>
    <form id="date-info-form">
      <div class="mb-3">
        <label for="month" class="form-label">Month</label>
        <input type="number" class="form-control" id="month" min="1" max="12" required>
      </div>
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="number" class="form-control" id="date" min="1" max="31" required>
      </div>
      <div class="mb-3">
        <label for="year" class="form-label">Year</label>
        <input type="number" class="form-control" id="year" min="1700" max="2100" required>
      </div>
      <div class="mb-3">
        <label for="snippet" class="form-label">Snippet</label>
        <textarea class="form-control" id="snippet" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" disabled>Submit</button>
    </form>
  </div>

  <!-- Load Firebase SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBDUAF3qJGhLYQJPHyWwY0JzonN5l8ERzE",
        authDomain: "mnthen-3151d.firebaseapp.com",
        databaseURL: "https://mnthen-3151d-default-rtdb.firebaseio.com",
        projectId: "mnthen-3151d",
        storageBucket: "mnthen-3151d.appspot.com",
        messagingSenderId: "416231360428",
        appId: "1:416231360428:web:36f69cc231be2d84a8dc09"
      };

      // Initialize Firebase
      const app = firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const database = firebase.database();

      // Ensure persistence
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .catch((error) => {
          console.error('Error setting persistence:', error);
        });

      // DOM Elements
      const loginSection = document.getElementById('login-section');
      const userSection = document.getElementById('user-section');
      const userDisplayEmail = document.getElementById('user-display-email');
      const loginBtn = document.getElementById('login-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const submitBtn = document.getElementById('submit-btn');
      const dateInfoForm = document.getElementById('date-info-form');

      // Check if user is authenticated
      auth.onAuthStateChanged((user) => {
        if (user) {
          // User is logged in
          loginSection.classList.add('hidden');
          userSection.classList.remove('hidden');
          userDisplayEmail.textContent = user.email;
          submitBtn.disabled = false;
        } else {
          // User is not logged in
          loginSection.classList.remove('hidden');
          userSection.classList.add('hidden');
          userDisplayEmail.textContent = '';
          submitBtn.disabled = true;
        }
      });

      // Handle Login Button Click
      loginBtn.addEventListener('click', () => {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          alert('Please enter both email and password.');
          return;
        }

        auth.signInWithEmailAndPassword(email, password)
          .catch((error) => {
            console.error('Error signing in:', error.code, error.message);
            alert('Login failed: ' + error.message);
          });
      });

      // Handle Logout Button Click
      logoutBtn.addEventListener('click', () => {
        auth.signOut()
          .then(() => {
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
          })
          .catch((error) => {
            console.error('Error signing out:', error);
          });
      });

      // Add event listener to the form
      dateInfoForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) {
          alert('You must be logged in to submit this form.');
          return;
        }

        const month = document.getElementById('month').value;
        const date = document.getElementById('date').value;
        const year = document.getElementById('year').value;
        const snippet = document.getElementById('snippet').value;

        // Create a new date key with leading zeros for proper formatting
        const dateKey = `${month.toString().padStart(2, '0')}-${date.toString().padStart(2, '0')}`;

        // Create a new event object with year and snippet
        const newEvent = {
          year: year,
          snippet: snippet
        };

        // Push the new event object to the database under the date key
        const dateInfoRef = database.ref('date-info').child(dateKey);
        const newEventRef = dateInfoRef.push();
        const eventId = newEventRef.key;
        const eventRef = dateInfoRef.child(eventId);
        eventRef.set(newEvent)
          .then(() => {
            alert('Date information added successfully!');
            dateInfoForm.reset();
          })
          .catch((error) => {
            console.error('Error adding date information:', error);
            alert('An error occurred. Please try again later.');
          });
      });
    });
  </script>
</body>
</html>
